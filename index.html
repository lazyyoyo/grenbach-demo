<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>그렌바흐 대공령 v0.9.9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
  /* 단일 테마(겨울 밤의 석조 성)로 고정 */
  :root {
    color-scheme: dark;
    --ground: #0F1217; --stone: #1A1F27; --stone-2: #252C37; --line: #333C4A;
    --text: #ECE6DA; --muted: #9AA0AB; --ember: #E0913E; --eye: #63B585; --seal: #D04A55; --ice: #9CC3E2; --gold: #DDB95E;
    --serif: 'Gowun Batang', 'Nanum Myeongjo', 'AppleMyungjo', serif;
    --sans: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  }
  html, body { height: 100%; }
  body { background: var(--ground); color: var(--text); font-family: var(--sans); font-size: 13.5px; line-height: 1.4; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  .app { max-width: 520px; overflow-x: hidden; margin: 0 auto; padding-inline: 10px; padding-block: 8px 20px; display: grid; gap: 8px; }

  .top { min-width: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .top h1 { font-family: var(--serif); font-size: 17px; margin: 0; }
  /* 속도 버튼 옆에 두면 390px에서 두 줄로 접혀 제목 아래 한 줄로 뺐다 */
  /* 계절 띠: 한 해(120일)를 네 칸으로 보여 "평가단 n일 뒤"가 얼마나 긴지 감을 준다 */
  .strip { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: center; background: none; border: 0; padding: 0; margin-top: -4px; text-align: left; }
  .strip .bar { position: relative; height: 10px; display: grid; grid-template-columns: repeat(4, 1fr); border-radius: 3px; overflow: hidden; }
  .strip .bar span { font-size: 9px; line-height: 10px; padding-left: 4px; color: rgba(236,230,218,.75); white-space: nowrap; overflow: hidden; }
  .strip .s0 { background: rgba(126,154,106,.35); } .strip .s1 { background: rgba(184,166,90,.35); } .strip .s2 { background: rgba(176,122,74,.35); } .strip .s3 { background: rgba(127,160,184,.35); }
  .strip .past { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(255,255,255,.16); pointer-events: none; }
  .strip .now { position: absolute; top: -1px; bottom: -1px; width: 2px; margin-left: -1px; background: #fff; pointer-events: none; }
  .strip .flag { font-size: 9.5px; color: var(--seal); white-space: nowrap; }
  .date { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: -6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .speed { display: flex; gap: 4px; }
  .speed button { background: var(--stone); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; font-size: 12px; color: var(--muted); }
  .speed button.on { color: var(--text); border-color: var(--ember); }
  .res { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
  .pill { min-width: 0; display: grid; grid-template-columns: 20px minmax(0, 1fr); align-items: center; gap: 0 6px; background: var(--stone); border-radius: 8px; padding: 5px 7px; }
  .pill svg { grid-row: span 2; width: 22px; height: 22px; }
  .pill b { font-size: 15px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .pill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 10px; font-variant-numeric: tabular-nums; color: var(--muted); }
  .up { color: var(--eye) !important; } .dn { color: var(--seal) !important; }
  .crib { display: grid; grid-template-columns: 40px repeat(3, minmax(0, 1fr)); gap: 8px; align-items: center; background: var(--stone); border-radius: 10px; padding: 6px 8px; }
  .crib img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--eye); }
  .meter { display: grid; gap: 3px; font-size: 10.5px; color: var(--muted); }
  .meter .t { height: 5px; border-radius: 3px; background: var(--stone-2); overflow: hidden; }
  .meter .t i { display: block; height: 100%; transition: width .4s; }
  .m-health i { background: var(--ice); } .m-bond i { background: var(--eye); } .m-sus i { background: var(--seal); }
  .meter.warn { color: var(--seal); }
  .banner { border-radius: 8px; padding: 7px 10px; font-size: 12.5px; background: rgba(208,74,85,.18); border: 1px solid rgba(208,74,85,.55); }
  .banner.cold { background: rgba(156,195,226,.12); border-color: rgba(156,195,226,.45); }

  /* ── 성 단면도 ── */
  .world { position: relative; border-radius: 12px; overflow: hidden; background: linear-gradient(#1B2436 0, #2B3550 60px, #3A4258 120px, #232833 121px); touch-action: none; }
  .mount { position: absolute; left: 0; right: 0; top: 18px; height: 70px; background: #2A3245; clip-path: polygon(0 100%, 0 55%, 12% 20%, 22% 45%, 35% 5%, 48% 40%, 60% 15%, 73% 50%, 85% 10%, 100% 45%, 100% 100%); opacity: .9; }
  .mount.b { top: 34px; background: #39425A; clip-path: polygon(0 100%, 0 70%, 15% 45%, 30% 65%, 45% 30%, 62% 60%, 78% 35%, 100% 60%, 100% 100%); }
  /* 캔버스 속성 크기(높이 × DPR)가 CSS 크기로 새면 .world가 안쪽으로 스크롤될 만큼 커진다 — CSS 크기를 고정한다 */
  .snow { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .yard { position: absolute; background: linear-gradient(#5E6675, #4A505C); border-top: 3px solid #E9EEF4; }
  .yard .tag, .room .tag { position: absolute; left: 7px; top: 5px; font-size: 11px; font-weight: 600; letter-spacing: .02em; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .yard .tag { color: #E9EEF4; left: auto; right: 8px; top: auto; bottom: 4px; font-weight: 500; font-size: 10.5px; opacity: .8; }
  .keepwall { position: absolute; background: repeating-linear-gradient(0deg, #3B4250 0 14px, #343A47 14px 15px), #3B4250; border-radius: 4px; }
  .room { position: absolute; border-radius: 4px; overflow: hidden; background: #2D2620; box-shadow: inset 0 0 0 2px rgba(0,0,0,.35); cursor: pointer; }
  .room .light { position: absolute; inset: 0; pointer-events: none; }
  .room .tag .cap { font-weight: 400; opacity: .7; margin-left: 4px; }
  .room .out { position: absolute; right: 6px; top: 5px; font-size: 10.5px; color: rgba(255,255,255,.75); font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px #000; }
  .room .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 9px; background: #5A4A3A; border-top: 2px solid #6E5B47; }
  .room.empty { background: repeating-linear-gradient(45deg, #1E222A 0 8px, #22262F 8px 16px); }
  .room.empty .build { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
  .room.empty .build b { display: block; font-size: 22px; line-height: 1; color: #6A7282; text-align: center; }
  .room.can { box-shadow: inset 0 0 0 3px var(--ember); }
  .room.nope { filter: brightness(.55); }
  .room.raid { box-shadow: inset 0 0 0 3px var(--seal); animation: quake .3s linear infinite; }
  @keyframes quake { 0%,100% { transform: translateX(0); } 30% { transform: translateX(-1.5px); } 70% { transform: translateX(1.5px); } }
  .prog { position: absolute; left: 6px; right: 6px; bottom: 12px; height: 3px; border-radius: 2px; background: rgba(0,0,0,.35); overflow: hidden; }
  .prog i { display: block; height: 100%; background: rgba(255,255,255,.7); }
  /* 방 종류별 실내 */
  .r-gate { background: linear-gradient(#3A3530, #2B2723); }
  .r-gate .dec { position: absolute; left: 50%; top: 18px; width: 44%; height: 60%; transform: translateX(-50%); border-radius: 40px 40px 0 0; background: repeating-linear-gradient(90deg, #1A1612 0 3px, transparent 3px 11px), repeating-linear-gradient(0deg, #1A1612 0 3px, transparent 3px 12px), #0E1420; }
  .r-gate .banner-wolf { position: absolute; right: 8px; top: 20px; width: 14px; height: 26px; background: #C9CCD4; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%); }
  .r-lumber { background: linear-gradient(#3B3122, #2C251B); }
  .r-lumber .dec { position: absolute; right: 8px; bottom: 9px; width: 46px; height: 30px; background: radial-gradient(circle at 20% 70%, #9C7A4E 0 6px, #5C4426 6px 7px, transparent 7px), radial-gradient(circle at 55% 70%, #9C7A4E 0 6px, #5C4426 6px 7px, transparent 7px), radial-gradient(circle at 37% 30%, #9C7A4E 0 6px, #5C4426 6px 7px, transparent 7px), radial-gradient(circle at 72% 30%, #9C7A4E 0 6px, #5C4426 6px 7px, transparent 7px), radial-gradient(circle at 88% 70%, #9C7A4E 0 6px, #5C4426 6px 7px, transparent 7px); }
  .r-kitchen { background: linear-gradient(#3E2E22, #2E231B); }
  .r-kitchen .dec { position: absolute; right: 10px; bottom: 9px; width: 40px; height: 38px; background: #4B3E35; border-radius: 4px 4px 0 0; }
  .r-kitchen .dec::after, .r-forge .dec::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: 0; height: 16px; border-radius: 50% 50% 0 0; background: radial-gradient(circle at 50% 100%, #FFD27A, #E0913E 50%, #A3401F 80%, transparent 82%); animation: flick 0.9s infinite alternate; }
  @keyframes flick { from { transform: scaleY(.85); opacity: .85; } to { transform: scaleY(1.1); opacity: 1; } }
  .r-kitchen .light, .r-forge .light { background: radial-gradient(circle at 85% 90%, rgba(224,145,62,.28), transparent 60%); }
  .r-forge { background: linear-gradient(#33302F, #252322); }
  .r-forge .dec { position: absolute; right: 10px; bottom: 9px; width: 34px; height: 24px; background: #4A4643; border-radius: 3px 3px 0 0; }
  .r-forge .anvil { position: absolute; left: 44%; bottom: 9px; width: 26px; height: 12px; background: #1F1D1C; clip-path: polygon(0 0, 100% 0, 80% 40%, 70% 100%, 30% 100%, 20% 40%); }
  .r-barracks { background: linear-gradient(#2E3138, #23262C); }
  .r-barracks .dec { position: absolute; right: 10px; bottom: 9px; width: 30px; height: 44px; background: repeating-linear-gradient(90deg, transparent 0 5px, #8A8F98 5px 7px, transparent 7px 12px); border-top: 3px solid #6B5742; }
  .r-barracks .dummy { position: absolute; left: 40%; bottom: 9px; width: 14px; height: 34px; background: #9C7A4E; border-radius: 7px 7px 2px 2px; }
  .r-dorm { background: linear-gradient(#352B2F, #282125); }
  .r-dorm .dec { position: absolute; right: 8px; bottom: 9px; width: 54px; height: 14px; background: #7A5C66; border-radius: 3px; box-shadow: 0 -20px 0 -2px #6A4E58; }
  .r-parlor { background: linear-gradient(#3A2A2E, #2B1F22); }
  .r-parlor .light { background: radial-gradient(circle at 30% 30%, rgba(221,185,94,.16), transparent 60%); }
  .r-parlor .dec { position: absolute; right: 8px; bottom: 9px; width: 30px; height: 26px; background: #6E2E38; border-radius: 8px 8px 2px 2px; }
  .r-nursery { background: linear-gradient(#2F3A33, #232B26); }
  .r-nursery .light { background: radial-gradient(circle at 70% 80%, rgba(99,181,133,.22), transparent 60%); }
  .cradle { position: absolute; right: 10px; bottom: 9px; width: 48px; height: 24px; border-radius: 0 0 24px 24px; background: #8A6A48; border-top: 3px solid #A7845C; }
  .cradle::before { content: ''; position: absolute; left: 12px; top: -10px; width: 22px; height: 14px; border-radius: 50%; background: #EDE3CF; box-shadow: inset -3px -2px 0 #D5C7AC; }
  .cradle .cry { position: absolute; right: -2px; top: -34px; font-size: 11px; font-weight: 600; color: #FFF; background: var(--seal); border-radius: 8px; padding: 1px 6px; animation: bob .6s infinite alternate; white-space: nowrap; }
  .cradle .zz { position: absolute; right: 0; top: -30px; font-size: 11px; color: var(--ice); animation: bob 1.4s infinite alternate; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-4px); } }

  /* 사람 */
  .fig { position: absolute; width: 22px; height: 40px; margin-left: -11px; touch-action: none; cursor: grab; z-index: 3; transition: filter .2s; }
  .fig .h { position: absolute; left: 5px; top: 0; width: 12px; height: 12px; border-radius: 50%; background: #EBC9A8; }
  .fig .hair { position: absolute; left: 4px; top: -1px; width: 14px; height: 6px; border-radius: 7px 7px 2px 2px; }
  .fig .b { position: absolute; left: 3px; top: 12px; width: 16px; height: 17px; border-radius: 5px 5px 2px 2px; }
  .fig .l { position: absolute; top: 28px; width: 5px; height: 9px; background: #2B2622; border-radius: 0 0 2px 2px; }
  .fig .l.a { left: 5px; } .fig .l.c { left: 12px; }
  .fig.walk .l.a { animation: stepA .4s infinite alternate; } .fig.walk .l.c { animation: stepA .4s infinite alternate-reverse; }
  @keyframes stepA { from { transform: translateY(0); } to { transform: translateY(-2px); } }
  .fig.work { animation: bob .5s infinite alternate; }
  .fig .nm { position: absolute; top: 39px; left: 50%; transform: translateX(-50%); font-size: 9.5px; white-space: nowrap; color: #E9EEF4; text-shadow: 0 1px 2px #000, 0 0 4px #000; }
  .fig .hpb { position: absolute; top: -6px; left: 3px; width: 16px; height: 3px; background: rgba(0,0,0,.5); border-radius: 2px; overflow: hidden; }
  .fig .hpb i { display: block; height: 100%; background: var(--eye); }
  .fig.sel { filter: drop-shadow(0 0 3px var(--ember)) drop-shadow(0 0 2px var(--ember)); }
  .fig.drag { cursor: grabbing; z-index: 9; filter: drop-shadow(0 4px 6px rgba(0,0,0,.6)); transform: scale(1.15); }
  .fig.hurt { filter: grayscale(1) brightness(.7); }
  .fig.hurt .b::after { content: '+'; position: absolute; left: 4px; top: -1px; color: var(--seal); font-weight: 700; font-size: 13px; }
  .fig.npc { cursor: default; }
  .fig .eye { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; background: var(--seal); color: #fff; border-radius: 6px; padding: 0 4px; white-space: nowrap; }
  .fig.raider .b { background: #8E2F2A !important; }
  .fig.raider .hair { background: #3A2B20 !important; height: 8px; }
  .meter .t { position: relative; } .meter .goal { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #fff; opacity: .8; }
  .meter small { font-size: 10px; color: var(--muted); }
  .room .pv { position: absolute; left: 6px; right: 6px; top: 22px; font-size: 11px; font-weight: 600; color: #FFE3A8; text-shadow: 0 1px 2px #000; pointer-events: none; }
  button.pill { border: 0; text-align: left; color: inherit; font: inherit; cursor: pointer; }
  .pill.blink { animation: blink 1s steps(2) infinite; box-shadow: inset 0 0 0 1px var(--seal); }
  @keyframes blink { 50% { background: rgba(208,74,85,.35); } }
  .picks { display: grid; gap: 4px; }
  .pick { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 6px 8px; background: var(--stone-2); border-radius: 8px; }
  .fig .eye.cand { background: var(--ember); color: #1A1410; }
  .fig.cand, .fig.merch { cursor: pointer; }
  .fig .eye.calm { background: #4A5568; }
  .fig .eye.merch { background: #6B5A8E; color: #fff; }
  .room.constructing .light, .room.constructing .dec, .room.constructing .anvil, .room.constructing .dummy { opacity: .35; }
  .opt .q { white-space: pre-line; }
  h1 .ver { font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: .04em; }
  .raidbars { position: absolute; z-index: 4; display: grid; gap: 3px; pointer-events: none; }
  .raidbars .rb { display: grid; grid-template-columns: 34px 1fr 38px; align-items: center; gap: 4px; font-size: 10px; color: #fff; text-shadow: 0 1px 2px #000; }
  .raidbars .rb .num { text-align: right; font-variant-numeric: tabular-nums; }
  .raidbar.gatebar i { background: #C9CCD4; }
  .raidbar { position: relative; height: 5px; border-radius: 3px; background: rgba(0,0,0,.55); overflow: hidden; z-index: 4; }
  .raidbar i { display: block; height: 100%; background: var(--seal); }
  .clash { position: absolute; z-index: 5; font-size: 13px; font-weight: 700; color: #FFE3A0; text-shadow: 0 0 4px #E0913E; pointer-events: none; animation: pop .6s ease-out forwards; }
  .pop { position: absolute; z-index: 6; font-size: 11.5px; font-weight: 600; pointer-events: none; text-shadow: 0 1px 2px #000; animation: rise 1.4s ease-out forwards; white-space: nowrap; }
  @keyframes rise { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-26px); opacity: 0; } }
  @keyframes pop { from { transform: scale(.6); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }

  .panel { background: var(--stone); border-radius: 10px; padding: 9px 10px; display: grid; gap: 6px; }
  .who { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .who b { font-size: 14.5px; }
  .stats3 { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats3 span b { color: var(--text); font-size: 12.5px; }
  .hint { font-size: 12px; color: var(--muted); margin: 0; }
  .log { font-size: 11.5px; color: var(--muted); display: grid; gap: 1px; }
  .log div:first-child { color: var(--text); }
  .btn { background: var(--stone-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; }

  .modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: end center; background: rgba(5,7,10,.72); padding: 16px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }
  .sheet { width: min(476px, 100%); background: #151A21; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: grid; animation: up .25s ease both; max-height: 90dvh; overflow-y: auto; }
  @keyframes up { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet .pic { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; object-position: center 25%; display: block; }
  .sheet .body { padding: 14px 16px 16px; display: grid; gap: 10px; }
  .sheet .eyebrow { font-size: 11px; letter-spacing: .14em; color: var(--ember); }
  .sheet h2 { font-family: var(--serif); font-size: 20px; margin: 0; }
  .sheet p { font-family: var(--serif); font-size: 15px; line-height: 1.7; margin: 0; white-space: pre-line; }
  .opts { display: grid; gap: 8px; }
  .opt { text-align: left; background: var(--stone-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; }
  .opt:hover:not(:disabled) { border-color: var(--ember); }
  .opt b { font-size: 14.5px; } .opt span { font-size: 12px; color: var(--muted); }
  .opt:disabled { opacity: .45; cursor: default; }
  .buildgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .buildgrid .opt { grid-template-rows: 46px auto auto; padding: 8px; }
  .buildgrid .mini { position: relative; border-radius: 4px; overflow: hidden; }
  /* 컷씬: 이야기 목소리만 — 화자 · 본문 · 쪽 점 · 버튼 하나 */
  .sheet.scene p { font-size: 16px; }
  /* 캐릭터 시트(3분할)는 오른쪽 끝이 초상이라 4:3으로 오른쪽을 잘라 보인다 */
  .sheet.scene .pic { aspect-ratio: 4 / 3; object-fit: cover; object-position: 100% 30%; }
  .sheet .dots { font-size: 9px; letter-spacing: .3em; color: var(--muted); }
  /* 튜토리얼: 모달이 아니라 화면 아래에 붙는 안내 줄. 성을 보면서 따라 하게 한다 */
  #tut { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 10px); background: rgba(15,18,23,.96); border-top: 1px solid var(--line); }
  #tut .in { max-width: 500px; margin: 0 auto; display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 8px; align-items: start; }
  #tut .tfig { position: relative; height: 64px; }
  #tut .fig { left: 50%; top: 2px; transform: scale(1.4); transform-origin: top center; cursor: default; }
  #tut .tsay { font-family: var(--serif); font-size: 14.5px; line-height: 1.55; margin: 0; }
  #tut .tsys { font-size: 12px; color: var(--muted); margin: 3px 0 0; }
  #tut .tact { display: flex; gap: 10px; align-items: center; justify-content: flex-end; margin-top: 6px; }
  #tut .tskip { background: none; border: 0; padding: 4px 2px; font-size: 11.5px; color: var(--muted); text-decoration: underline; }
  body.tutoring .app { padding-bottom: 170px; }
  .tut-hl { outline: 2px solid var(--gold); outline-offset: -2px; animation: tutPulse 0.9s ease-in-out infinite alternate; }
  .fig.tut-hl { outline-offset: 2px; border-radius: 4px; }
  @keyframes tutPulse { from { outline-color: rgba(221,185,94,.35); } to { outline-color: rgba(221,185,94,1); } }
</style>

<div class="app">
  <div class="top"><div><h1>그렌바흐 대공령 <small class="ver">v0.9.9</small></h1></div><div class="speed" id="speed"></div></div>
  <div class="date" id="date"></div>
  <button class="strip" id="strip" aria-label="한 해 달력"></button>
  <div class="res" id="res"></div>
  <div class="crib" id="crib"></div>
  <div id="banner"></div>
  <div class="world" id="world"><div class="mount"></div><div class="mount b"></div><canvas class="snow" id="snow"></canvas></div>
  <div class="panel" id="panel"></div>
</div>
<div id="tut" hidden></div>
<div id="modal"></div>

<script src="data.js"></script>
<script>
(() => {
  const K = window.KEEP, R = K.rooms;
  const DAY_MS = 2600;
  const $ = id => document.getElementById(id);
  const world = $('world');
  const STAT = { str: '힘', dex: '솜씨', heart: '마음' };
  const B = K.balance, ARMORY_CAP = B.armoryCap;
  const BODY = { str: '#B5652E', dex: '#B89A3E', heart: '#3F8A5E' };
  const clamp = (v, lo = 0, hi = 100) => Math.max(lo, Math.min(hi, v));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let G, loop = null, raidLoop = null, acc = 0, last = 0, queue = [], showing = false;
  let geo = null; // 방 좌표
  const figs = new Map(); // folk id → {el, x, tx, wait}

  // ═════════ 상태 · 규칙 ═════════
  function newGame() {
    const rooms = {};
    K.layout.forEach((row, r) => row.forEach((t, c) => { rooms[`r${r}c${c}`] = t; }));
    G = {
      day: 0, res: { ...K.start }, rooms, folk: K.folk.map(f => mkFolk(f, { room: f.room })),
      julian: { health: 80, bond: 15 }, sus: 20, speed: 1, sel: null, raid: null, raidsWon: 0,
      ms: 0, absentUntil: -1, blizzardUntil: -1, log: [], over: null, refugeeIdx: 0, captiveIdx: 0,
      expeditions: [], candidates: [], wandererIdx: 0, levels: {}, building: {}, upgrading: {}, armory: [], crafting: null, merchant: null, graveyard: [],
      homelessCame: false, leoHere: false, leoState: 'parlor', leoReturnDay: -1, berk: false, berkDone: false, tut: null,
    };
    figs.forEach(f => f.el.remove()); figs.clear();
    buildCastle(); renderTut();
    scene([
      { img: SCN('opening-1'), who: '지난겨울 · 그렌바흐', text: '아버지는 황후가 된 동생 리셀라 곁에서 수도의 일을 보았다. 그 겨울, 빈 영주 의자 앞에 아버지와 동생의 부고가 검은 봉인으로 놓였다.' },
      { img: SCN('opening-2'), who: '그 겨울 · 그렌바흐', text: '기사들마저 수도에 있던 성을 호르칸이 덮쳤다. 바깥채는 타고, 성문과 응접실, 요람실만 남았다.' },
      { img: SCN('opening-3'), fallback: 'media/ottilie.webp', who: '겨울 30일 · 성문', text: '자매를 키운 늙은 유모 오틸리에가 눈보라 속에서 성문을 두드렸다. 품에는 갓난아기가 안겨 있었다.' },
      { img: SCN('opening-4'), fallback: 'media/julian.webp', who: '오틸리에', text: '"리셀라 님이 가시며 맡기셨습니다, 아가씨. 율리안 님 대신 황실 묘지에는 이름 모를 아기를 뉘고 왔습니다."' },
      { img: SCN('opening-5'), fallback: 'media/eleanor.webp', who: '엘레노어', text: '"수도는 아이도 어미를 따라갔다고 하겠지." 오틸리에는 그날 밤 추위를 이기지 못했다.' },
      { img: SCN('opening-6'), who: '봄 1일 · 베른하르트', text: '"아가씨… 아니, 각하, 아이는 요한나가 젖을 물렸습니다. 성은 보시는 대로입니다."' },
    ], [{ label: '성을 둘러본다', fn: startTut }]);
    start();
  }
  // 장면 그림은 media/scenes/<이름>.webp — 파일이 없으면 fallback 그림으로 한 번 바꾸고, 그것도 없거나 실패하면 그림만 지운다
  const SCN = n => `media/scenes/${n}.webp`;
  const slots = () => Object.keys(G.rooms);
  const at = slot => G.folk.filter(f => f.room === slot);
  const working = slot => at(slot).filter(f => !f.hurt);
  const typeOf = slot => G.rooms[slot];
  const slotOf = type => slots().find(s => G.rooms[s] === type);
  // 방 레벨 1~3. 효과 배수는 Lv1 ×1, Lv2 ×1.5, Lv3 ×2
  const lvOf = slot => G.levels[slot] || 1;
  const mult = slot => [1, 1.5, 2][lvOf(slot) - 1];
  const firstMult = type => { const s = slotOf(type); return s ? mult(s) : 1; };
  const popCap = () => K.popBase + slots().filter(s => G.rooms[s] === 'dorm' && !G.building[s]).reduce((a, s) => a + R.dorm.pop * mult(s), 0);
  const gateHold = () => GATE_HOLD * firstMult('gate');
  const gateBonus = () => 6 * firstMult('gate');
  const eleanor = () => G.folk.find(f => f.hero);
  const away = () => G.day < G.absentUntil;
  // 달력 대신 계절과 날 수로 센다 — 11월~3월 달력으로는 얼마나 남았는지 감이 오지 않았다
  // 해는 끝나지 않고 이어진다. 일정(상인·습격·눈보라·평가)은 해 안의 날(doy)로 반복한다
  const yearOf = d => Math.floor(d / K.totalDays) + 1;
  const doy = () => G.day % K.totalDays;
  const dateOf = d => `${yearOf(d)}년 ${K.seasons[Math.floor((d % K.totalDays) / K.seasonDays)]} ${d % K.seasonDays + 1}일`;
  const raidF = r => Math.round(r.n * r.h * (1 + B.raidYearMult * (yearOf(G.day) - 1)));
  const say = t => { G.log.unshift(`${dateOf(G.day)} · ${t}`); G.log.length = Math.min(G.log.length, 20); };
  const sum = (arr, k) => arr.reduce((s, f) => s + f[k], 0);
  const best = f => ['str', 'dex', 'heart'].sort((a, b) => f[b] - f[a])[0];
  const mkFolk = (p, extra = {}) => ({ ...p, room: null, hp: 100, hurt: 0, xp: 0, level: 1, weapon: null, starve: 0, ...extra });
  const maxHp = f => B.hpBase + B.hpPerLv * (f.level || 1);
  // 적성: 가장 높은 능력치가 방의 능력치와 같으면 ×1.25 — 몸 색과 방 색이 맞는 사람
  const apt = (f, t) => R[t]?.stat && best(f) === R[t].stat ? B.aptitude : 1;
  const eff = (f, slot) => f[R[typeOf(slot)].stat] * apt(f, typeOf(slot));
  const sumEff = (list, slot) => list.reduce((a, f) => a + eff(f, slot), 0);
  // 추위: 계절 기본(봄 1 · 여름 0 · 가을 1 · 겨울 2) + 눈보라 2. 장작 소비·정찰 부상·장작이 없을 때의 피해가 모두 이 수치에서 나온다
  const COLD = () => K.coldBySeason[Math.floor(G.day / K.seasonDays) % 4] + (G.day < G.blizzardUntil ? B.blizzardCold : 0);
  const need = L => B.xpBase * Math.pow(L, B.xpExp);
  function levelUp(f) {
    while (f.xp >= need(f.level)) { // 레벨 상한 없음. 주능력치는 10에서 멈추고 그 뒤로는 최대 체력만 는다
      f.xp -= need(f.level); f.level++; const k = best(f); f[k] = Math.min(10, f[k] + 1); f.hp = Math.min(maxHp(f), f.hp + B.hpPerLv); say(`${f.name}이(가) Lv${f.level}이 되었다. ${STAT[k]} +1`); }
  }
  function die(f) {
    G.folk = G.folk.filter(x => x !== f); G.graveyard.push(f);
    if (f.weapon) { G.armory.push(f.weapon); f.weapon = null; }
    say(`${f.name}이(가) 죽었다.`);
    event({ eyebrow: dateOf(G.day), title: `${f.name}이(가) 죽었다`, text: `쓰러진 채로 ${G.res.food <= 0 ? '굶주림' : '추위'}이 이어졌다. 눈 속에 묻었다.\n\n쓰러진 사람은 체력이 더 깎이면 죽는다. 식량과 장작을 먼저 챙긴다.`, choices: [{ label: '…' }] });
  }
  const restOf = f => !f.room ? 6 : typeOf(f.room) === 'dorm' ? 15 * mult(f.room) : 0;
  // 짓는 중인 방은 돌아가지 않는다. 무기를 만드는 날은 가장 솜씨 좋은 대장간 일꾼이 금화 대신 무기를 만든다
  function rateOf(slot) {
    const t = R[typeOf(slot)]; if (!t || !t.res || G.building[slot]) return 0;
    let ws = working(slot);
    if (G.crafting && G.crafting.slot === slot) ws = ws.filter(f => f.id !== G.crafting.wid);
    return sumEff(ws, slot) * t.rate * mult(slot);
  }
  const eats = () => 0.5 * G.folk.filter(f => !f.away).length;
  const woodUse = () => COLD();
  const made = r => slots().filter(s => R[typeOf(s)]?.res === r).reduce((a, s) => a + rateOf(s), 0);
  // 지금 수지로 며칠 뒤 바닥나는지 — 마이너스일 때만
  const daysLeft = (v, per) => per < 0 ? Math.floor(v / -per) : Infinity;
  function daily() {
    const n = G.folk.length;
    const tot = r => slots().filter(s => R[typeOf(s)]?.res === r).reduce((a, s) => a + rateOf(s), 0);
    const care = working(slotOf('nursery')), parlor = working(slotOf('parlor'));
    return {
      food: tot('food') - eats(), wood: tot('wood') - woodUse(), gold: tot('gold'),
      // 의심은 레오폴트가 성에 온 뒤(봄 8일)부터 쌓인다. 엘레노어가 국경 성에 가 있어도 그는 성에 남아 계속 본다
      sus: !G.leoHere ? 0 : B.susBase - sumEff(parlor, slotOf('parlor')) * B.susParlor * firstMult('parlor'), bond: (sumEff(care, slotOf('nursery')) * 0.04 + (care.some(f => f.hero) ? 0.8 : 0)) * firstMult('nursery'), care,
    };
  }

  function start() {
    clearInterval(loop); last = performance.now(); acc = 0;
    loop = setInterval(() => {
      const now = performance.now(), dt = now - last; last = now;
      tutCheck();
      if (G.over || G.raid || showing || !G.speed || tutPaused()) return;
      acc += dt * G.speed;
      while (acc >= DAY_MS && !G.over && !G.raid && !showing && !tutPaused()) { acc -= DAY_MS; dayTick(); }
    }, 100);
  }
  function dayTick() {
    const d = daily();
    G.day++;
    G.res.food = Math.max(0, G.res.food + d.food); G.res.wood = Math.max(0, G.res.wood + d.wood); G.res.gold += d.gold;
    for (const s of slots()) {
      const t = R[typeOf(s)];
      if (t?.res && rateOf(s) > 0) pop(s, `+${rateOf(s).toFixed(1)} ${{ food: '식량', wood: '장작', gold: '금화' }[t.res]}`, t.res === 'gold' ? 'var(--gold)' : t.res === 'wood' ? '#C9A27A' : '#F0C38E');
    }
    // 건설·업그레이드·제작은 날이 지나야 끝난다
    for (const s of Object.keys(G.building)) if (G.building[s] <= G.day) { delete G.building[s]; say(`${R[typeOf(s)].name}을(를) 다 지었다.`); buildCastle(); }
    for (const s of Object.keys(G.upgrading)) if (G.upgrading[s].doneDay <= G.day) { G.levels[s] = G.upgrading[s].to; say(`${R[typeOf(s)].name}이(가) Lv${G.levels[s]}이 되었다.`); delete G.upgrading[s]; }
    if (G.crafting && G.crafting.doneDay <= G.day) { const w = K.weapons.find(x => x.id === G.crafting.weapon); G.armory.push({ id: w.id, dur: B.durability }); say(`대장간에서 ${w.name}을(를) 벼렸다. 성문 무기고에 두었다.`); pop(G.crafting.slot, w.name, 'var(--gold)'); G.crafting = null; }
    if (K.merchant.days.includes(doy())) { G.merchant = { until: G.day + K.merchant.stay, gold: K.merchant.purse }; say(`소금 장수 도착 · 지갑 금화 ${K.merchant.purse} · ${K.merchant.stay}일 머문다`); }
    else if (G.merchant && G.day >= G.merchant.until) { G.merchant = null; say('소금 장수가 떠났다.'); }
    const cold = COLD();
    for (const f of [...G.folk]) {
      if (f.away) continue;
      // 일어날 때 체력 30 — 0으로 일어나면 식량이 0인 동안 곧바로 다시 쓰러져 아무도 주방에 못 서는 굴레에 빠졌다
      const dmg = (G.res.food <= 0 ? 8 : 0) + (G.res.wood <= 0 ? cold : 0);
      if (f.hurt > 0) {
        // 쓰러진 채로 굶주림·추위가 이어지면 죽는다 — 쓰러짐이 끝이면 식량을 게을리해도 벌이 없었다
        if (dmg) { f.starve += dmg; if (f.starve >= B.deathDmg && !f.hero) { die(f); continue; } }
        f.hurt--; if (!f.hurt) { f.hp = Math.max(f.hp, 30); f.starve = 0; say(`${f.name}이(가) 몸을 추슬렀다.`); }
      } else f.starve = 0;
      // 체력은 쉬어야 찬다 — 어디서나 저절로 차서 깎인 채 들어온 포로를 병영에 넣어도 곧 다 차 버렸다
      f.hp = clamp(f.hp + (dmg ? -dmg : restOf(f)), 0, maxHp(f));
      if (f.hp <= 0 && !f.hurt) { f.hurt = 4; f.room = null; say(`${f.name}이(가) ${G.res.food <= 0 ? '굶주려' : '추위에'} 쓰러졌다.`); }
      if (f.room && !f.hurt) { f.xp += typeOf(f.room) === 'barracks' ? 3 * mult(f.room) : 1; levelUp(f); }
    }
    const j = G.julian;
    if (!d.care.length) j.health -= 8; else if (G.res.wood <= 0) j.health -= 5 * Math.max(0, cold - (lvOf(slotOf('nursery')) >= 2 ? 1 : 0)); else j.health += 3 * firstMult('nursery');
    if (G.res.wood <= 0) say('장작이 떨어졌다. 성이 식어 간다.');
    j.health = clamp(j.health); j.bond = clamp(j.bond + d.bond);
    G.sus = clamp(G.sus + d.sus);
    if (G.day === G.absentUntil) { const e = eleanor(); if (e) e.lead = Math.min(10, e.lead + 1); say('엘레노어가 국경 성에서 돌아왔다. 통솔 +1'); }
    if (j.health <= 0) return endGame('sick');
    if (G.sus >= 100) return endGame('taken');
    if (!G.folk.some(f => !f.hero)) return endGame('empty');
    const m = K.milestones[G.ms]; if (m && j.bond >= m[0]) { G.ms++; scene([{ img: SCN(`milestone-${G.ms}`), fallback: 'media/julian.webp', who: `성장 기록 · ${m[1]}`, text: m[2] }]); }
    for (const r of K.raids) { if (doy() === r.day - 3) say(`경보: ${r.name} · 전투력 ${raidF(r)} · 사흘 뒤 도착`); if (doy() === r.day) startRaid(r); }
    if (K.refugeeDays.includes(doy())) refugee();
    returnScouts();
    story();
    if (doy() === 0 && G.day > 0 && !G.over) inspection();
    rollLeo();
    renderHud();
  }
  function story() {
    const d = doy();
    // 레오폴트가 오기 전에는 의심이 움직이지 않는다 — 컷씬 버튼이 아니라 이 날 자체로 켠다(봇·검사가 dayTick만 불러도 같게)
    if (G.day === K.leoDay) { G.leoHere = true; say('레오폴트 비젠이 아버지의 관을 모셔 와 성에 묵기 시작했다.'); scene([
      { img: SCN('leopold-1'), who: '봄 15일 · 성문', text: '황궁의 문장을 단 검은 마차가 성문에 섰다. 마차에는 겨울 산길이 풀리기를 기다린 아버지의 관이 실려 있었다.' },
      { img: SCN('leopold-2'), who: '레오폴트', text: '"선대 대공의 일, 깊이 애도합니다. 황후 폐하의 아기도 결국 어미를 따라갔지요, 각하."' },
      { img: SCN('leopold-2'), who: '레오폴트', text: '"황궁은 갑자기 성을 맡으신 각하를 걱정합니다. 다음 봄 평가단이 올 때까지 제가 곁에서 돕지요."' },
    ], [{ label: '맞이한다', sub: '지금부터 의심이 쌓인다 · 응접실 사람의 마음이 막는다' }]); }
    // 튜토리얼을 건너뛰었거나 정찰 단계 전에 끝났으면 봄 8일(이후 첫날)에 같은 방식으로 온다. 튜토리얼이 진행 중이면 튜토리얼이 부른다
    if (G.day >= 7 && !G.homelessCame && G.tut == null) arriveHomeless();
    if (G.day === G.leoReturnDay) { G.leoHere = true; say('레오폴트가 돌아왔다.'); }
    if (d === 67) scene([
      { img: SCN('border-1'), who: '가을 8일 · 성문', text: '"베르크 기사령에서 왔습니다. 국경 성의 겨울 채비를 대공 각하와 함께 보고 싶다 하십니다."' },
      { img: SCN('border-2'), who: '엘레노어', text: '국경 성은 먼 산길 끝에 있었다. 레오폴트는 각하가 없는 동안 성에 남겠다고 했다.' },
    ], [
      { label: '간다', sub: G.berkDone ? '엘레노어 12일 부재 · 돌아오면 통솔 +1 · 지략 +0.5' : '엘레노어 12일 부재 · 돌아오면 통솔 +1 · 겨울 1일에 베르크 기사 2명 합류', fn: () => { const e = eleanor(); G.absentUntil = G.day + 12; e.room = null; e.wit = Math.min(10, e.wit + 0.5); G.berk = true; say('엘레노어가 국경 성으로 떠났다. 12일 부재'); } },
      { label: '가지 않는다', sub: '지략 +0.5 · 베르크와 소원해진다', fn: () => { const e = eleanor(); e.wit = Math.min(10, e.wit + 0.5); say('베르크 기사령에 거절 서신을 보냈다.'); } },
    ]);
    // 기사는 처음 간 해에 한 번만 온다
    if (d === 90 && G.berk && !G.berkDone) { G.berkDone = true; K.knights.forEach((k, i) => G.folk.push(mkFolk(k, { id: 'k' + i }))); say('베르크 기사령에서 기사 둘이 왔다.'); scene([{ img: SCN('knights'), who: '겨울 1일 · 성문', text: '푸른 망토의 베르크 기사들이 성문으로 들어왔다. 앞선 이는 아른트, 흰 말을 탄 이는 테오였다.' }]); }
    if (d === K.blizzard.day) { G.blizzardUntil = G.day + K.blizzard.days; scene([{ img: SCN('blizzard'), who: '겨울 8일', text: '긴 눈보라가 산맥을 넘어왔다. 성벽 너머로는 흰 것 말고 아무것도 보이지 않았다.' }],
      [{ label: '벌목장을 챙긴다', sub: `추위 ${COLD() - B.blizzardCold} → ${COLD()} · 장작 하루 ${woodUse()} · 정찰 부상 +${B.blizzardCold * 3}%p` }]); }
  }
  // 받으면 하루 식량 수지가 어떻게 바뀌는지 — "식량 0.5 추가"만으로는 늘어나는 게 소비인지 보상인지 알 수 없었다
  const eatNote = () => {
    const f = daily().food, now = daysLeft(G.res.food, f), next = daysLeft(G.res.food, f - 0.5);
    const tail = next === Infinity ? '' : ` · 식량 바닥까지 ${now === Infinity ? '걱정 없음' : now + '일'} → ${next}일`;
    return `식량 하루 ${fmt(f)} → ${fmt(f - 0.5)} (한 사람이 하루 0.5를 먹는다)${tail}`;
  };
  function refugee() {
    // 1년째는 정해진 피난민(엘제·프리츠·안나) 다음 떠돌이, 2년째부터는 정찰 후보와 같은 떠돌이 풀에서 순서대로(정찰이 먼저 데려간 사람은 건너뛴다)
    const p = yearOf(G.day) === 1 && G.refugeeIdx < K.refugees.length ? K.refugees[G.refugeeIdx++] : G.wandererIdx < K.wanderers.length ? K.wanderers[G.wandererIdx++] : null;
    if (!p) return;
    event({ eyebrow: dateOf(G.day), title: '성문 앞의 피난민', text: `${p.line ? p.line + '\n' : ''}${p.role} ${p.name} · 힘 ${p.str} · 솜씨 ${p.dex} · 마음 ${p.heart}${FULL()}`, choices: [
      { label: '받아들인다', sub: eatNote(), disabled: () => G.folk.length >= popCap(), fn: () => { G.folk.push(mkFolk(p, { id: 'p' + G.day })); say(`${p.name}이(가) 영지민이 되었다.`); } },
      { label: '돌려보낸다' },
    ] });
  }
  const FULL = () => G.folk.length >= popCap() ? '\n정원이 찼다 — 숙소가 필요하다' : '';
  const HIDE_MAX = 30; // 성문이 무너졌을 때 호르칸 체력이 이 값 이하여야 요람실에서 숨어 버틸 수 있다
  const GATE_HOLD = 30, GATE_BREAK = 3; // 성문 버팀 30을 1틱(0.9초)에 3씩 — 성문이 비고 약 9초면 부서진다
  // ═════════ 정찰 ═════════
  // 보상은 보낸 사람의 힘·인원·일수에 비례하고 오래 비울수록 할증이 붙는다 — 고정 보상일 때는 약한 사람 혼자 보내는 것이 늘 최적이었다
  const scoutRisk = (d, f, n) => Math.max(0.03, d.risk - 0.06 * (n - 1) + COLD() * 0.03 - (f.raiderLook ? 0.05 : 0) - (!away() && eleanor() ? eleanor().wit * 0.005 : 0));
  function scoutQuote(dest, ppl) {
    const d = K.scouts.find(x => x.id === dest), n = ppl.length, avg = n ? sum(ppl, 'str') / n : 0;
    return { d, gold: Math.round(n * avg * d.days * R.forge.rate * (1 + B.scoutBonus * d.days)), food: n * 0.5 * B.ration * d.days, risks: ppl.map(f => scoutRisk(d, f, n)) };
  }
  function sendScouts(dest, ids) {
    const ppl = ids.map(id => G.folk.find(x => x.id === id)), q = scoutQuote(dest, ppl);
    if (G.res.food < q.food) return `식량이 ${q.food} 필요하다 (지금 ${Math.floor(G.res.food)}).`;
    G.res.food -= q.food;
    for (const f of ppl) { f.away = dest; f.prevRoom = f.room; f.room = null; }
    G.expeditions.push({ dest, ids, back: G.day + q.d.days, gold: q.gold });
    say(`${ppl.map(f => f.name).join('·')}이(가) 식량 ${q.food}을 지고 ${q.d.name}(으)로 떠났다. ${q.d.days}일 뒤 귀환`);
    return null;
  }
  function returnScouts() {
    for (const ex of G.expeditions.filter(e => e.back <= G.day)) {
      G.expeditions = G.expeditions.filter(e => e !== ex);
      const d = K.scouts.find(x => x.id === ex.dest), ppl = ex.ids.map(id => G.folk.find(f => f.id === id)).filter(Boolean);
      const hurt = [];
      for (const f of ppl) {
        f.away = null; f.xp += d.days; levelUp(f);
        if (Math.random() < scoutRisk(d, f, ppl.length)) { f.hurt = B.injuryDays; f.hp = 40; hurt.push(f.name); continue; }
        const pr = f.prevRoom, cap = pr && R[typeOf(pr)]?.cap; // 떠나기 전 자리가 비어 있으면 그 방으로 돌아간다
        if (cap && at(pr).length < cap && !G.building[pr]) f.room = pr;
      }
      G.res.gold += ex.gold;
      let found = null;
      if (Math.random() < d.find && G.wandererIdx < K.wanderers.length) { found = K.wanderers[G.wandererIdx++]; G.candidates.push({ ...found, id: 'w' + G.day + G.wandererIdx }); }
      say(`${d.name} 정찰대가 돌아왔다. 금화 +${ex.gold}${hurt.length ? ` · 부상 ${hurt.join('·')}` : ''}`);
      event({ eyebrow: '정찰 귀환', title: `${d.name}에서 돌아왔다`, text: `${ppl.map(f => f.name).join('·')}이(가) 돌아왔다.\n\n받은 것: 금화 +${ex.gold} · 경험치 +${d.days}${hurt.length ? `\n다친 사람: ${hurt.join('·')} (${B.injuryDays}일 동안 일하지 못한다)` : ''}${found ? `\n\n${found.role} ${found.name}을(를) 데려왔다. 안뜰에 서 있으니 눌러서 받을지 정한다.` : ''}`, choices: [{ label: '확인' }] });
    }
  }
  function candidateSheet(c) {
    event({ eyebrow: '안뜰의 후보', title: `${c.role} ${c.name}`, text: `${c.line}\n힘 ${c.str} · 솜씨 ${c.dex} · 마음 ${c.heart}${FULL()}`, choices: [
      { label: '영지민으로 받는다', sub: `${eatNote()} · 정원 ${G.folk.length}/${popCap()}`, disabled: () => G.folk.length >= popCap(), fn: () => { G.candidates = G.candidates.filter(x => x !== c); G.folk.push(mkFolk(c)); say(`${c.name}이(가) 영지민이 되었다.`); } },
      { label: '돌려보낸다', fn: () => { G.candidates = G.candidates.filter(x => x !== c); say(`${c.name}이(가) 성을 떠났다.`); } },
      { label: '안뜰에서 더 기다리게 한다' },
    ] });
  }
  function scoutSheet() {
    if (showing || G.over) return;
    const free = G.folk.filter(f => !f.hurt && !f.away && !(f.hero && away()));
    showing = true;
    const busy = G.expeditions.map(e => `<div class="hint">${K.scouts.find(d => d.id === e.dest).name} · ${e.back - G.day}일 뒤 귀환 · ${e.ids.map(id => G.folk.find(f => f.id === id)?.name).join('·')}</div>`).join('');
    $('modal').innerHTML = `<div class="modal"><div class="sheet"><div class="body">
      <div class="eyebrow">정찰 · 추위 ${COLD()}</div><h2>산 너머로 누구를 보낼까</h2>
      <p class="hint">1~3명. 떠난 사람은 돌아올 때까지 일도, 돌봄도, 성문 방어도 하지 못한다. 보상은 보낸 사람들의 힘 × 일수에 비례하고, 오래 비울수록 할증이 붙는다. 식량은 출발할 때 낸다.</p>${busy}
      <div class="picks">${free.map(f => `<label class="pick"><input type="checkbox" value="${f.id}"><span><b>${esc(f.name)}</b> 힘 ${Math.round(f.str)} · ${f.room ? R[typeOf(f.room)].name : '안뜰'}</span></label>`).join('') || '<p class="hint">보낼 수 있는 사람이 없다.</p>'}</div>
      <div class="opts">${K.scouts.map(d => `<button class="opt" data-d="${d.id}"><b>${d.name} · ${d.days}일 · 사람을 만날 확률 ${Math.round(d.find * 100)}%</b><span class="q"></span></button>`).join('')}
      <div class="err hint" role="status"></div><button class="opt" data-close><b>그만둔다</b></button></div></div></div></div>`;
    const upd = () => {
      const ppl = [...$('modal').querySelectorAll('.pick input:checked')].map(x => G.folk.find(f => f.id === x.value));
      $('modal').querySelectorAll('[data-d]').forEach(b => { const q = scoutQuote(b.dataset.d, ppl);
        b.querySelector('.q').textContent = ppl.length ? `받는 것: 금화 +${q.gold} · 경험치 +${q.d.days}\n내는 것: 식량 ${q.food} (출발 때) · 다칠 확률 ${q.risks.map((r, i) => `${ppl[i].name} ${Math.round(r * 100)}%`).join(', ')}` : `사람을 고르면 계산된다. 금화 = 인원 × 평균 힘 × ${q.d.days}일 × ${R.forge.rate} × 할증 ${(1 + B.scoutBonus * q.d.days).toFixed(2)}`; });
    };
    $('modal').querySelectorAll('.pick input').forEach(i => i.addEventListener('change', upd)); upd();
    const close = () => { $('modal').innerHTML = ''; showing = false; last = performance.now(); renderHud(); renderPanel(); syncRooms(); pump(); };
    $('modal').querySelector('[data-close]').onclick = close;
    $('modal').querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
      const ids = [...$('modal').querySelectorAll('.pick input:checked')].map(x => x.value);
      if (ids.length < 1 || ids.length > 3) { $('modal').querySelector('.err').textContent = '1~3명을 고른다.'; return; }
      const err = sendScouts(b.dataset.d, ids); if (err) { $('modal').querySelector('.err').textContent = err; return; }
      close();
    });
  }

  // ═════════ 무기 ═════════
  const weaponPower = f => f.weapon ? K.weapons.find(w => w.id === f.weapon.id).power : 0;
  const wname = w => K.weapons.find(x => x.id === w.id).name;
  function craftErr(slot, wid) {
    const w = K.weapons.find(x => x.id === wid);
    if (!working(slot).length) return '대장간에 일꾼이 없다.';
    if (G.crafting) return '이미 무기를 만드는 중이다.';
    if (G.armory.length >= ARMORY_CAP) return `성문 무기고가 찼다 (${ARMORY_CAP}자리).`;
    if (G.res.gold < w.power * B.weaponGoldPerP || G.res.wood < B.weaponWood) return '금화나 장작이 모자란다.';
    return null;
  }
  function craft(slot, wid) {
    const err = craftErr(slot, wid); if (err) return err;
    const w = K.weapons.find(x => x.id === wid), smith = working(slot).slice().sort((a, b) => b.dex - a.dex)[0];
    G.res.gold -= w.power * B.weaponGoldPerP; G.res.wood -= B.weaponWood;
    G.crafting = { slot, weapon: wid, wid: smith.id, doneDay: G.day + 1 };
    say(`${smith.name}이(가) ${w.name}을(를) 벼리기 시작했다. 내일 완성`); return null;
  }
  // 무기고(성문 3자리)에서 들거나 내려놓는다 — 인벤토리 화면 대신 자리 수로 묶는다
  function equip(fid, idx) {
    const f = G.folk.find(x => x.id === fid); if (!f) return;
    if (idx < 0) { if (!f.weapon) return; if (G.armory.length >= ARMORY_CAP) return note('무기고가 찼다.'); G.armory.push(f.weapon); f.weapon = null; return note(`${f.name}이(가) 무기를 내려놓았다.`); }
    const w = G.armory[idx]; if (!w) return;
    G.armory.splice(idx, 1); if (f.weapon) G.armory.push(f.weapon); f.weapon = w;
    note(`${f.name}이(가) ${wname(w)}을(를) 들었다. 성문 방어 +${K.weapons.find(x => x.id === w.id).power}`);
  }
  // 무기는 습격 한 번에 내구도 1씩 닳는다 — 닳지 않으면 한 번 만든 무기가 영원해서 대장간이 다시 필요 없었다
  function wearWeapons(ids) {
    for (const id of ids) { const f = G.folk.find(x => x.id === id); if (!f?.weapon) continue; f.weapon.dur--; if (f.weapon.dur <= 0) { const n = wname(f.weapon); f.weapon = null; say(`${f.name}의 ${n}이(가) 부서져 못 쓰게 됐다. 대장간에서 새로 벼려야 한다.`); } }
  }

  // ═════════ 상인 ═════════
  // 살 때는 기준가의 1.5배, 팔 때는 0.5배 — 생산보다 늘 손해라서 급할 때만 쓴다
  const price = (res, qty, buy) => Math.round(qty / B.vGold * (buy ? B.mBuy : B.mSell) * (res === 'wood' && COLD() >= 2 ? 2 : 1));
  function merchantSheet() {
    const q = K.merchant.qty, nm = { food: '식량', wood: '장작' };
    const rows = ['food', 'wood'].flatMap(res => [
      { label: `${nm[res]} ${q}을 산다 · 금화 ${price(res, q, true)}`, sub: `기준가 ${Math.round(q / B.vGold * (res === 'wood' && COLD() >= 2 ? 2 : 1))} × ${B.mBuy}`, disabled: () => G.res.gold < price(res, q, true), fn: () => { G.res.gold -= price(res, q, true); G.res[res] += q; say(`상인에게서 ${nm[res]} ${q}을 샀다. 금화 −${price(res, q, true)}`); } },
      // 상인의 지갑이 비면 더 못 판다 — 무제한이면 재고를 다 금화로 바꿔 버린다
      { label: `${nm[res]} ${q}을 판다 · 금화 ${price(res, q, false)}`, sub: `기준가 × ${B.mSell} · 상인 지갑 금화 ${G.merchant.gold}`, disabled: () => G.res[res] < q || G.merchant.gold < price(res, q, false), fn: () => { G.res.gold += price(res, q, false); G.merchant.gold -= price(res, q, false); G.res[res] -= q; say(`상인에게 ${nm[res]} ${q}을 팔았다. 금화 +${price(res, q, false)}`); } },
    ]);
    event({ eyebrow: '안뜰의 상인', title: '소금 장수', text: `살 때 ×${B.mBuy} · 팔 때 ×${B.mSell} · 겨울 장작 ×2 · 지갑 금화 ${G.merchant.gold} · ${G.merchant.until - G.day}일 뒤 떠난다\n금화 ${Math.floor(G.res.gold)} · 식량 ${Math.floor(G.res.food)} · 장작 ${Math.floor(G.res.wood)}`, choices: [...rows, { label: '보낸다' }] });
  }

  // 병영 사람은 습격 때 성문으로 나가 함께 싸운다
  const barracksFolk = () => slots().filter(s => typeOf(s) === 'barracks').flatMap(working);
  const defenders = () => [...working(slotOf('gate')), ...barracksFolk()];
  const defStr = f => f.str * apt(f, 'gate') + weaponPower(f);
  // 엘레노어가 성에 있으면 통솔만큼 성문 방어에 더해진다 — 어느 방에 있든 지휘한다
  const leadBonus = () => { const e = eleanor(); return e && !away() && !e.hurt ? e.lead : 0; };
  const defense = () => defenders().reduce((a, f) => a + defStr(f), 0) + gateBonus() + leadBonus();
  function startRaid(r) {
    const F = raidF(r);
    G.raid = { ...r, F, hp: F * B.raidHpK, max: F * B.raidHpK, atk: F * B.raidAtk, breakPerTick: 2 + F * 0.04, gateHp: gateHold(), fought: [] };
    say(`${r.name}(전투력 ${F})가 성문에 닿았다!`);
    renderHud(); syncRooms();
    clearInterval(raidLoop); raidLoop = setInterval(raidTick, 900);
  }
  // 싸움은 성문에서만 한다 — 플레이어가 병사를 세운 곳이 성문이라, 다른 방 사람을 건드리면 납득되지 않았다
  function raidTick() {
    if (showing) return;
    const rd = G.raid; if (!rd) return clearInterval(raidLoop);
    const gate = slotOf('gate'), def = defenders();
    if (def.length) {
      def.forEach(f => { if (!rd.fought.includes(f.id)) rd.fought.push(f.id); });
      rd.hp -= defense() * B.defK; clash(gate);
      const hit = rd.atk / def.length;
      for (const f of def) { f.hp = clamp(f.hp - hit * (f.hero ? 0.6 : 1), 0, maxHp(f)); if (f.hp <= 0) { f.hurt = 8; f.room = null; say(`${f.name}이(가) 성문에서 쓰러졌다.`); } }
      if (rd.hp <= 0) return raidWon();
    } else {
      rd.gateHp = Math.max(0, rd.gateHp - rd.breakPerTick); pop(gate, '쾅!', 'var(--seal)');
      if (rd.gateHp <= 0) return gateBroken();
    }
    renderHud(); syncRooms();
  }
  function gateBroken() {
    clearInterval(raidLoop);
    const rd = G.raid; G.raid = null; wearWeapons(rd.fought);
    // 약탈은 재고의 20% — 쌓아 둘수록 많이 잃는다
    const take = k => { const v = Math.round(G.res[k] * 0.2); G.res[k] -= v; return v; };
    const lost = { food: take('food'), wood: take('wood'), gold: take('gold') };
    G.sus = clamp(G.sus + 8);
    say(`성문이 부서졌다. 호르칸이 식량 ${lost.food}·장작 ${lost.wood}·금화 ${lost.gold}을 털었다. 레오폴트가 성벽 위에서 지켜본다. 의심 +8`);
    // 요람실 사람이 율리안을 안고 숨는 것은 지칠 대로 지친 습격대에게만 통한다
    if (!working(slotOf('nursery')).length || rd.hp > HIDE_MAX) return endGame('raided');
    G.julian.health = clamp(G.julian.health - 20);
    event({ eyebrow: '성문 함락', title: `${rd.name}가 요람실 문 앞까지 왔다`, text: `요람실을 지키던 사람이 율리안을 안고 굴뚝 뒤 좁은 틈에 숨었다. 호르칸은 빈 요람을 걷어차고 털어 간 것을 싣고 물러갔다.\n\n율리안 건강 −20 · 식량 −${lost.food} · 장작 −${lost.wood} · 금화 −${lost.gold} · 의심 +8`, choices: [{ label: '성문을 다시 세운다' }] });
    renderHud(); syncRooms();
  }
  function raidWon() {
    clearInterval(raidLoop);
    const rd = G.raid; G.raid = null; G.raidsWon++;
    wearWeapons(rd.fought);
    rd.fought.forEach(id => { const f = G.folk.find(x => x.id === id); if (f) { f.xp += 3; levelUp(f); } });
    const e = eleanor(); if (e && !away()) e.lead = Math.min(10, e.lead + 0.5);
    const loot = 15 + Math.round(rd.max / 4); G.res.gold += loot;
    say(`${rd.name}를 물리쳤다. 전리품 금화 +${loot} · 싸운 사람 경험치 +3 · 통솔 +0.5`);
    const c = K.captives[G.captiveIdx];
    if (c) {
      G.captiveIdx++;
      event({ eyebrow: '습격 격퇴', title: '호르칸 포로', text: `${c.line ? c.line + '\n' : ''}${c.role} ${c.name} · 힘 ${c.str} · 솜씨 ${c.dex} · 마음 ${c.heart}\n추위에 강하다 · 받으면 의심 +5${FULL()}`, choices: [
        { label: '영지민으로 받아들인다', sub: `의심 +5 · ${eatNote()}`, disabled: () => G.folk.length >= popCap(), fn: () => { G.folk.push(mkFolk(c, { id: 'c' + G.day, hp: 60, raiderLook: true })); G.sus = clamp(G.sus + 5); say(`${c.name}이(가) 늑대 문장 아래로 들어왔다.`); } },
        { label: '산맥 너머로 돌려보낸다' },
      ] });
    }
    renderHud(); syncRooms();
  }
  // 평가단이 수색할 때 율리안을 숨기는 힘 — 품에 익은 아이일수록, 요람실 사람이 따뜻할수록 울지 않는다
  const hideScore = () => Math.round(G.julian.bond + sumEff(working(slotOf('nursery')), slotOf('nursery')) * 3 + (eleanor() && !away() ? eleanor().wit * 3 : 0));

  // 컷씬: 한 장씩 큐에 넣는다. 마지막 장만 선택지를 가진다

  const roomEl = t => world.querySelector(`.room[data-s="${slotOf(t)}"]`);

  const DECOR = {

  // 고른 사람을 이 방에 놓으면 무엇이 바뀌는지 — 놓기 전에 나아지는지 알 수 있게
  function preview(f, slot) {

    if (f.hurt) return '';

    const v = r.stat ? eff(f, slot) : 0, ap = r.stat && apt(f, t) > 1 ? ' · 적성 +25%' : '';
    if (r.res) return `+${(v * r.rate * mult(slot)).toFixed(1)} ${{ food: '식량', wood: '장작', gold: '금화' }[r.res]}/일${ap}`;

    if (t === 'barracks') return `XP +${3 * mult(slot)}/일 · 습격 때 출전`;
    if (t === 'parlor') return `의심 하루 −${(v * B.susParlor * mult(slot)).toFixed(2)}${ap}`;

  function syncRooms() {

    world.querySelectorAll('.room').forEach(el => {

    if (!G) return;
    const d = daily(), j = G.julian, nextRaid = K.raids.find(r => r.day > doy()), toInsp = K.totalDays - doy(), yr = yearOf(G.day);
    // 1년 = 120일이지만 나이는 겨울을 날 때마다(봄 1일) 한 살씩 센다
    $('date').textContent = `${dateOf(G.day)} · ${yr === 1 ? `생후 ${30 + G.day}일` : `${yr - 1}세`} · 평가단 ${toInsp}일 뒤`;
    const pct = (doy() + 0.5) / K.totalDays * 100;
    $('strip').innerHTML = `<div class="bar">${K.seasons.map((n, i) => `<span class="s${i}">${n}</span>`).join('')}<i class="past" style="width:${pct}%"></i><i class="now" style="left:${pct}%"></i></div><span class="flag">⚑ 평가단</span>`;
    $('strip').onclick = () => note(`1계절 ${K.seasonDays}일 · 1년 ${K.totalDays}일 · 하루 ${DAY_MS / 1000}초(×1) · 평가단은 겨울이 끝나면 온다`);
    $('speed').innerHTML = [[0, '❚❚'], [1, '1×'], [2, '2×'], [4, '4×']].map(([v, l]) => `<button data-sp="${v}" class="${G.speed === v ? 'on' : ''}" aria-label="속도 ${l}">${l}</button>`).join('');
    $('speed').querySelectorAll('button').forEach(b => b.onclick = () => { G.speed = +b.dataset.sp; renderHud(); });
    const fl = daysLeft(G.res.food, d.food), wl = daysLeft(G.res.wood, d.wood);
    const sub = (per, left) => left === Infinity ? `하루 ${fmt(per)}` : left <= 0 ? '바닥!' : `바닥 ${left}일`;
    $('res').innerHTML = `<button class="pill ${fl <= 3 || G.res.food <= 0 ? 'blink' : ''}" data-r="food">${ICON.food}<b>${Math.floor(G.res.food)}</b><span class="${d.food >= 0 ? 'up' : 'dn'}">${sub(d.food, fl)}</span></button>
      <button class="pill ${wl <= 3 || G.res.wood <= 0 ? 'blink' : ''}" data-r="wood">${ICON.wood}<b>${Math.floor(G.res.wood)}</b><span class="${d.wood >= 0 ? 'up' : 'dn'}">${sub(d.wood, wl)}</span></button>
      <button class="pill" data-r="gold">${ICON.gold}<b>${Math.floor(G.res.gold)}</b><span>하루 ${fmt(d.gold)}</span></button>
      <button class="pill" data-r="folk">${ICON.folk}<b>${G.folk.length}/${popCap()}</b><span>정원 · 습격 ${G.raidsWon}승</span></button>`;
    $('res').querySelectorAll('[data-r]').forEach(b => b.onclick = () => { G.sel = null; syncRooms(); note(resNote(b.dataset.r)); });
    $('crib').innerHTML = `<img src="media/julian.webp" alt="율리안">
      <div class="meter m-health ${j.health < 30 ? 'warn' : ''}">율리안 건강 ${Math.round(j.health)}<div class="t"><i style="width:${j.health}%"></i></div></div>
      <div class="meter m-bond">애착 ${Math.round(j.bond)}<div class="t"><i style="width:${j.bond}%"></i></div></div>
      <div class="meter m-sus ${G.sus >= SUS_SEARCH ? 'warn' : ''}">의심 ${Math.round(G.sus)} <small>${!G.leoHere ? '손님 없음' : G.sus < SUS_CLEAN ? '평가 통과' : G.sus < SUS_SEARCH ? '레오폴트가 남음' : `수색 · 숨기기 ${hideScore()}`}</small><div class="t"><i style="width:${G.sus}%"></i><b class="goal" style="left:40%"></b><b class="goal" style="left:70%"></b></div></div>`;
    $('banner').innerHTML = G.raid ? `<div class="banner">${esc(G.raid.name)} 습격 중! 전투력 ${G.raid.F} vs 방어 ${Math.round(defense())}. 힘센 영지민을 성문으로. 성문 버팀 ${Math.ceil(G.raid.gateHp)}/${gateHold()} — 무너질 때 호르칸 체력이 ${HIDE_MAX}을 넘으면 요람실이 털린다</div>`
      : toInsp <= 10 ? `<div class="banner">평가단 ${toInsp}일 뒤 · 의심 ${Math.round(G.sus)} → ${G.sus < SUS_CLEAN ? '덮인 장부 · 의심 10 · 레오폴트 떠남' : G.sus < SUS_SEARCH ? '의심 −15 · 레오폴트 남음 (40 미만이면 떠난다)' : `수색 — 숨기기 ${hideScore()}가 의심보다 커야 한다`}</div>`
      : !slotOf('kitchen') || !slotOf('lumber') ? `<div class="banner">${!slotOf('kitchen') ? '주방' : '벌목장'}이 없다 — 빈 칸을 눌러 짓는다 (금화 40 · 2일). 식량 ${daysLeft(G.res.food, daily().food) < Infinity ? daysLeft(G.res.food, daily().food) + '일' : '충분'} · 장작 ${daysLeft(G.res.wood, daily().wood) < Infinity ? daysLeft(G.res.wood, daily().wood) + '일' : '충분'} 뒤 바닥</div>`
      : G.res.food <= 0 ? `<div class="banner">식량이 바닥났다. 영지민이 굶주려 쓰러진다 — 주방에 솜씨 좋은 사람을.</div>`
      : nextRaid && nextRaid.day - doy() <= 3 ? `<div class="banner">경보: ${esc(nextRaid.name)} ${nextRaid.day - doy()}일 뒤 · 전투력 ${raidF(nextRaid)}. 성문(왼쪽 위)에 힘센 영지민을.</div>`
      : G.day < G.blizzardUntil ? `<div class="banner cold">눈보라 — 추위 ${COLD()}, 장작 하루 ${woodUse()} (${G.blizzardUntil - G.day}일)</div>`
      : G.merchant ? `<div class="banner cold">소금 장수가 안뜰에 있다 — 누르면 사고판다 · ${G.merchant.until - G.day}일 뒤 떠난다</div>`
      : away() ? `<div class="banner cold">엘레노어 국경 성 부재 · ${G.absentUntil - G.day}일 뒤 귀환</div>` : '';
    renderPanel(); syncRooms();
    world.querySelectorAll('.prog i').forEach(i => { i.style.width = (acc / DAY_MS * 100) + '%'; });
  }
  function renderPanel() {
    const selF = G.sel && G.folk.find(x => x.id === G.sel);
    const fresh = performance.now() - noteT < 6000 ? noteMsg : '';
    $('panel').innerHTML = selF
      ? `<div class="who"><b>${esc(selF.name)} <span style="font-weight:400;color:var(--muted);font-size:12px">${esc(selF.role)} · Lv${selF.level}</span></b><button class="btn" id="toYard">안뜰로</button></div>
         <div class="stats3"><span>힘 <b>${Math.round(selF.str)}</b></span><span>솜씨 <b>${Math.round(selF.dex)}</b></span><span>마음 <b>${Math.round(selF.heart)}</b></span><span>체력 <b>${Math.round(selF.hp)}/${maxHp(selF)}</b></span><span>XP <b>${Math.floor(selF.xp)}/${selF.level < 5 ? need(selF.level) : '—'}</b></span>${selF.hero ? `<span>통솔 <b>${selF.lead}</b></span><span>지략 <b>${selF.wit}</b></span>` : ''}</div>
         <div class="who"><span class="hint">무기: ${selF.weapon ? `${wname(selF.weapon)} (내구 ${selF.weapon.dur}/${B.durability})` : '없음'}</span><span>${G.armory.map((a, i) => `<button class="btn" data-eq="${i}">${wname(a)} 들기</button>`).join('')}${selF.weapon ? '<button class="btn" data-eq="-1">내려놓기</button>' : ''}</span></div>
         <p class="hint">${selF.hurt ? `부상 — ${selF.hurt}일 뒤 회복` : '빛나는 방을 누르면 그 방에서 일한다. 끌어다 놓아도 된다.'}</p>`
      : `<p class="hint">${fresh ? esc(fresh) : '영지민을 끌어다 방에 놓는다. 몸 색 = 잘하는 일 — <span style="color:#E0913E">주황 힘</span> · <span style="color:#DDB95E">노랑 솜씨</span> · <span style="color:#63B585">초록 마음</span>'}</p>`;
    if (!selF) $('panel').insertAdjacentHTML('afterbegin', `<div class="who"><span class="hint">${G.expeditions.length ? `정찰 중 ${G.expeditions.map(e => `${K.scouts.find(d => d.id === e.dest).name} ${e.back - G.day}일`).join(' · ')}` : '금화가 모자라면 정찰을 보낸다.'}</span><button class="btn" id="scoutBtn">정찰 보내기</button></div>`);
    $('panel').insertAdjacentHTML('beforeend', `<div class="log">${G.log.slice(0, 3).map(l => `<div>${esc(l)}</div>`).join('')}</div>`);
    $('scoutBtn')?.addEventListener('click', scoutSheet);
    $('toYard')?.addEventListener('click', () => { selF.room = null; G.sel = null; renderPanel(); syncRooms(); });
    $('panel').querySelectorAll('[data-eq]').forEach(b => b.onclick = () => { equip(selF.id, +b.dataset.eq); renderPanel(); syncRooms(); renderHud(); });
  }

  // 눈
  const snow = $('snow'), sctx = snow.getContext('2d'); let flakes = [];
  function sizeSnow() { const dpr = devicePixelRatio || 1; snow.width = world.clientWidth * dpr; snow.height = (geo?.H || 600) * dpr; sctx.setTransform(dpr, 0, 0, dpr, 0, 0); flakes = Array.from({ length: 70 }, () => ({ x: Math.random() * world.clientWidth, y: Math.random() * 160, s: 0.6 + Math.random() * 1.6, v: 0.01 + Math.random() * 0.03 })); }
  function drawSnow(dt) {
    const heavy = G && G.day < G.blizzardUntil;
    sctx.clearRect(0, 0, snow.width, snow.height); sctx.fillStyle = 'rgba(255,255,255,.8)';
    for (const f of flakes) { f.y += f.v * dt * (heavy ? 3 : 1); f.x += (heavy ? 0.06 : 0.01) * dt; if (f.y > 156) { f.y = -4; f.x = Math.random() * world.clientWidth; } if (f.x > world.clientWidth) f.x = 0; sctx.beginPath(); sctx.arc(f.x, f.y, f.s, 0, 7); sctx.fill(); }
  }

  let lastF = performance.now();
  function frame(now) {
    const dt = Math.min(60, now - lastF); lastF = now;
    animate(dt); drawSnow(dt);
    if (G && !G.raid && !showing && G.speed && !tutPaused()) world.querySelectorAll('.prog i').forEach(i => { i.style.width = Math.min(100, (acc / DAY_MS * 100)) + '%'; });
    requestAnimationFrame(frame);
  }
  addEventListener('resize', () => { if (G) buildCastle(); });
  // 브라우저 검수용 손잡이
  window.__keep09 = { get G() { return G; }, upCost, lvOf, startRaid, raidTick, assign, buildCastle, dayTick, sendScouts, scoutQuote, daily, popCap, newGame, craft, equip, merchantSheet, defense, need, COLD, maxHp, get showing() { return showing; },
    skipTutorial, scene, skipIntro() { queue.length = 0; $('modal').innerHTML = ''; showing = false; skipTutorial(); last = performance.now(); } };
  newGame(); renderHud(); requestAnimationFrame(frame);
})();
</script>
