<title>그렌바흐 변경성</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
  /* 단일 테마(겨울 밤의 석조 성)로 고정 */
  :root {
    color-scheme: dark;
    --ground: #0F1217; --stone: #1A1F27; --stone-2: #252C37; --line: #333C4A;
    --text: #ECE6DA; --muted: #9AA0AB; --ember: #E0913E; --eye: #63B585; --seal: #D04A55; --ice: #9CC3E2; --gold: #DDB95E;
    --serif: 'Gowun Batang', 'Nanum Myeongjo', 'AppleMyungjo', serif;
    --sans: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  }
  html, body { height: 100%; }
  body { background: var(--ground); color: var(--text); font-family: var(--sans); font-size: 13.5px; line-height: 1.4; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  .app { max-width: 520px; overflow-x: hidden; margin: 0 auto; padding-inline: 10px; padding-block: 8px 20px; display: grid; gap: 8px; }

  .top { min-width: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .top h1 { font-family: var(--serif); font-size: 17px; margin: 0; }
  .date { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .speed { display: flex; gap: 4px; }
  .speed button { background: var(--stone); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; font-size: 12px; color: var(--muted); }
  .speed button.on { color: var(--text); border-color: var(--ember); }
  .res { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
  .pill { min-width: 0; display: grid; grid-template-columns: 20px minmax(0, 1fr); align-items: center; gap: 0 6px; background: var(--stone); border-radius: 8px; padding: 5px 7px; }
  .pill svg { grid-row: span 2; width: 22px; height: 22px; }
  .pill b { font-size: 15px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .pill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 10px; font-variant-numeric: tabular-nums; color: var(--muted); }
  .up { color: var(--eye) !important; } .dn { color: var(--seal) !important; }
  .crib { display: grid; grid-template-columns: 40px repeat(3, minmax(0, 1fr)); gap: 8px; align-items: center; background: var(--stone); border-radius: 10px; padding: 6px 8px; }
  .crib img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--eye); }
  .meter { display: grid; gap: 3px; font-size: 10.5px; color: var(--muted); }
  .meter .t { height: 5px; border-radius: 3px; background: var(--stone-2); overflow: hidden; }
  .meter .t i { display: block; height: 100%; transition: width .4s; }
  .m-health i { background: var(--ice); } .m-bond i { background: var(--eye); } .m-sus i { background: var(--seal); }
  .meter.warn { color: var(--seal); }
  .banner { border-radius: 8px; padding: 7px 10px; font-size: 12.5px; background: rgba(208,74,85,.18); border: 1px solid rgba(208,74,85,.55); }
  .banner.cold { background: rgba(156,195,226,.12); border-color: rgba(156,195,226,.45); }

  /* ── 성 단면도 ── */
  .world { position: relative; border-radius: 12px; overflow: hidden; background: linear-gradient(#1B2436 0, #2B3550 60px, #3A4258 120px, #232833 121px); touch-action: none; }
  .mount { position: absolute; left: 0; right: 0; top: 18px; height: 70px; background: #2A3245; clip-path: polygon(0 100%, 0 55%, 12% 20%, 22% 45%, 35% 5%, 48% 40%, 60% 15%, 73% 50%, 85% 10%, 100% 45%, 100% 100%); opacity: .9; }
  .mount.b { top: 34px; background: #39425A; clip-path: polygon(0 100%, 0 70%, 15% 45%, 30% 65%, 45% 30%, 62% 60%, 78% 35%, 100% 60%, 100% 100%); }
  .snow { position: absolute; inset: 0; pointer-events: none; }
  .yard { position: absolute; background: linear-gradient(#5E6675, #4A505C); border-top: 3px solid #E9EEF4; }
  .yard .tag, .room .tag { position: absolute; left: 7px; top: 5px; font-size: 11px; font-weight: 600; letter-spacing: .02em; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .yard .tag { color: #E9EEF4; left: auto; right: 8px; top: auto; bottom: 4px; font-weight: 500; font-size: 10.5px; opacity: .8; }
  .keepwall { position: absolute; background: repeating-linear-gradient(0deg, #3B4250 0 14px, #343A47 14px 15px), #3B4250; border-radius: 4px; }
  .room { position: absolute; border-radius: 4px; overflow: hidden; background: #2D2620; box-shadow: inset 0 0 0 2px rgba(0,0,0,.35); cursor: pointer; }
  .room .light { position: absolute; inset: 0; pointer-events: none; }
  .room .tag .cap { font-weight: 400; opacity: .7; margin-left: 4px; }
  .room .out { position: absolute; right: 6px; top: 5px; font-size: 10.5px; color: rgba(255,255,255,.75); font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px #000; }
  .room .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 9px; background: #5A4A3A; border-top: 2px solid #6E5B47; }
  .room.empty { background: repeating-linear-gradient(45deg, #1E222A 0 8px, #22262F 8px 16px); }
  .room.empty .build { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
  .room.empty .build b { display: block; font-size: 22px; line-height: 1; color: #6A7282; text-align: center; }
  .room.can { box-shadow: inset 0 0 0 3px var(--ember); }
  .room.nope { filter: brightness(.55); }
  .room.raid { box-shadow: inset 0 0 0 3px var(--seal); animation: quake .3s linear infinite; }
  @keyframes quake { 0%,100% { transform: translateX(0); } 30% { transform: translateX(-1.5px); } 70% { transform: translateX(1.5px); } }
  .prog { position: absolute; left: 6px; right: 6px; bottom: 12px; height: 3px; border-radius: 2px; background: rgba(0,0,0,.35); overflow: hidden; }
  .prog i { display: block; height: 100%; background: rgba(255,255,255,.7); }
  /* 방 종류별 실내 */
  .r-gate { background: linear-gradient(#3A3530, #2B2723); }
  .r-gate .dec { position: absolute; left: 50%; top: 18px; width: 44%; height: 60%; transform: translateX(-50%); border-radius: 40px 40px 0 0; background: repeating-linear-gradient(90deg, #1A1612 0 3px, transparent 3px 11px), repeating-linear-gradient(0deg, #1A1612 0 3px, transparent 3px 12px), #0E1420; }
  .r-gate .banner-wolf { position: absolute; right: 8px; top: 20px; width: 14px; height: 26px; background: #C9CCD4; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%); }
  .r-lumber { background: linear-gradient(#3B3122, #2C251B); }
  .r-lumber .dec { position: absolute; right: 8px; bottom: 9px; width: 46px; height: 30px; background: radial-gradient(circle at 20% 70%, #9C7A4E 0 6px, #5C4426 6px 7px, transparent 7px), radial-gradient(circle at 55% 70%, #9C7A4E 0 6px, #5C4426 6px 7px, transparent 7px), radial-gradient(circle at 37% 30%, #9C7A4E 0 6px, #5C4426 6px 7px, transparent 7px), radial-gradient(circle at 72% 30%, #9C7A4E 0 6px, #5C4426 6px 7px, transparent 7px), radial-gradient(circle at 88% 70%, #9C7A4E 0 6px, #5C4426 6px 7px, transparent 7px); }
  .r-kitchen { background: linear-gradient(#3E2E22, #2E231B); }
  .r-kitchen .dec { position: absolute; right: 10px; bottom: 9px; width: 40px; height: 38px; background: #4B3E35; border-radius: 4px 4px 0 0; }
  .r-kitchen .dec::after, .r-forge .dec::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: 0; height: 16px; border-radius: 50% 50% 0 0; background: radial-gradient(circle at 50% 100%, #FFD27A, #E0913E 50%, #A3401F 80%, transparent 82%); animation: flick 0.9s infinite alternate; }
  @keyframes flick { from { transform: scaleY(.85); opacity: .85; } to { transform: scaleY(1.1); opacity: 1; } }
  .r-kitchen .light, .r-forge .light { background: radial-gradient(circle at 85% 90%, rgba(224,145,62,.28), transparent 60%); }
  .r-forge { background: linear-gradient(#33302F, #252322); }
  .r-forge .dec { position: absolute; right: 10px; bottom: 9px; width: 34px; height: 24px; background: #4A4643; border-radius: 3px 3px 0 0; }
  .r-forge .anvil { position: absolute; left: 44%; bottom: 9px; width: 26px; height: 12px; background: #1F1D1C; clip-path: polygon(0 0, 100% 0, 80% 40%, 70% 100%, 30% 100%, 20% 40%); }
  .r-barracks { background: linear-gradient(#2E3138, #23262C); }
  .r-barracks .dec { position: absolute; right: 10px; bottom: 9px; width: 30px; height: 44px; background: repeating-linear-gradient(90deg, transparent 0 5px, #8A8F98 5px 7px, transparent 7px 12px); border-top: 3px solid #6B5742; }
  .r-barracks .dummy { position: absolute; left: 40%; bottom: 9px; width: 14px; height: 34px; background: #9C7A4E; border-radius: 7px 7px 2px 2px; }
  .r-dorm { background: linear-gradient(#352B2F, #282125); }
  .r-dorm .dec { position: absolute; right: 8px; bottom: 9px; width: 54px; height: 14px; background: #7A5C66; border-radius: 3px; box-shadow: 0 -20px 0 -2px #6A4E58; }
  .r-parlor { background: linear-gradient(#3A2A2E, #2B1F22); }
  .r-parlor .light { background: radial-gradient(circle at 30% 30%, rgba(221,185,94,.16), transparent 60%); }
  .r-parlor .dec { position: absolute; right: 8px; bottom: 9px; width: 30px; height: 26px; background: #6E2E38; border-radius: 8px 8px 2px 2px; }
  .r-nursery { background: linear-gradient(#2F3A33, #232B26); }
  .r-nursery .light { background: radial-gradient(circle at 70% 80%, rgba(99,181,133,.22), transparent 60%); }
  .cradle { position: absolute; right: 10px; bottom: 9px; width: 48px; height: 24px; border-radius: 0 0 24px 24px; background: #8A6A48; border-top: 3px solid #A7845C; }
  .cradle::before { content: ''; position: absolute; left: 12px; top: -10px; width: 22px; height: 14px; border-radius: 50%; background: #EDE3CF; box-shadow: inset -3px -2px 0 #D5C7AC; }
  .cradle .cry { position: absolute; right: -2px; top: -34px; font-size: 11px; font-weight: 600; color: #FFF; background: var(--seal); border-radius: 8px; padding: 1px 6px; animation: bob .6s infinite alternate; white-space: nowrap; }
  .cradle .zz { position: absolute; right: 0; top: -30px; font-size: 11px; color: var(--ice); animation: bob 1.4s infinite alternate; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-4px); } }

  /* 사람 */
  .fig { position: absolute; width: 22px; height: 40px; margin-left: -11px; touch-action: none; cursor: grab; z-index: 3; transition: filter .2s; }
  .fig .h { position: absolute; left: 5px; top: 0; width: 12px; height: 12px; border-radius: 50%; background: #EBC9A8; }
  .fig .hair { position: absolute; left: 4px; top: -1px; width: 14px; height: 6px; border-radius: 7px 7px 2px 2px; }
  .fig .b { position: absolute; left: 3px; top: 12px; width: 16px; height: 17px; border-radius: 5px 5px 2px 2px; }
  .fig .l { position: absolute; top: 28px; width: 5px; height: 9px; background: #2B2622; border-radius: 0 0 2px 2px; }
  .fig .l.a { left: 5px; } .fig .l.c { left: 12px; }
  .fig.walk .l.a { animation: stepA .4s infinite alternate; } .fig.walk .l.c { animation: stepA .4s infinite alternate-reverse; }
  @keyframes stepA { from { transform: translateY(0); } to { transform: translateY(-2px); } }
  .fig.work { animation: bob .5s infinite alternate; }
  .fig .nm { position: absolute; top: 39px; left: 50%; transform: translateX(-50%); font-size: 9.5px; white-space: nowrap; color: #E9EEF4; text-shadow: 0 1px 2px #000, 0 0 4px #000; }
  .fig .hpb { position: absolute; top: -6px; left: 3px; width: 16px; height: 3px; background: rgba(0,0,0,.5); border-radius: 2px; overflow: hidden; }
  .fig .hpb i { display: block; height: 100%; background: var(--eye); }
  .fig.sel { filter: drop-shadow(0 0 3px var(--ember)) drop-shadow(0 0 2px var(--ember)); }
  .fig.drag { cursor: grabbing; z-index: 9; filter: drop-shadow(0 4px 6px rgba(0,0,0,.6)); transform: scale(1.15); }
  .fig.hurt { filter: grayscale(1) brightness(.7); }
  .fig.hurt .b::after { content: '+'; position: absolute; left: 4px; top: -1px; color: var(--seal); font-weight: 700; font-size: 13px; }
  .fig.npc { cursor: default; }
  .fig .eye { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; background: var(--seal); color: #fff; border-radius: 6px; padding: 0 4px; white-space: nowrap; }
  .fig.raider .b { background: #8E2F2A !important; }
  .fig.raider .hair { background: #3A2B20 !important; height: 8px; }
  .raidbar { position: absolute; height: 5px; border-radius: 3px; background: rgba(0,0,0,.55); overflow: hidden; z-index: 4; }
  .raidbar i { display: block; height: 100%; background: var(--seal); }
  .clash { position: absolute; z-index: 5; font-size: 13px; font-weight: 700; color: #FFE3A0; text-shadow: 0 0 4px #E0913E; pointer-events: none; animation: pop .6s ease-out forwards; }
  .pop { position: absolute; z-index: 6; font-size: 11.5px; font-weight: 600; pointer-events: none; text-shadow: 0 1px 2px #000; animation: rise 1.4s ease-out forwards; white-space: nowrap; }
  @keyframes rise { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-26px); opacity: 0; } }
  @keyframes pop { from { transform: scale(.6); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }

  .panel { background: var(--stone); border-radius: 10px; padding: 9px 10px; display: grid; gap: 6px; }
  .who { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .who b { font-size: 14.5px; }
  .stats3 { display: flex; gap: 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats3 span b { color: var(--text); font-size: 12.5px; }
  .hint { font-size: 12px; color: var(--muted); margin: 0; }
  .log { font-size: 11.5px; color: var(--muted); display: grid; gap: 1px; }
  .log div:first-child { color: var(--text); }
  .btn { background: var(--stone-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; }

  .modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: end center; background: rgba(5,7,10,.72); padding: 16px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }
  .sheet { width: min(476px, 100%); background: #151A21; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: grid; animation: up .25s ease both; max-height: 90dvh; overflow-y: auto; }
  @keyframes up { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet .pic { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; object-position: center 25%; display: block; }
  .sheet .body { padding: 14px 16px 16px; display: grid; gap: 10px; }
  .sheet .eyebrow { font-size: 11px; letter-spacing: .14em; color: var(--ember); }
  .sheet h2 { font-family: var(--serif); font-size: 20px; margin: 0; }
  .sheet p { font-family: var(--serif); font-size: 15px; line-height: 1.7; margin: 0; white-space: pre-line; }
  .opts { display: grid; gap: 8px; }
  .opt { text-align: left; background: var(--stone-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; }
  .opt:hover:not(:disabled) { border-color: var(--ember); }
  .opt b { font-size: 14.5px; } .opt span { font-size: 12px; color: var(--muted); }
  .opt:disabled { opacity: .45; cursor: default; }
  .buildgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .buildgrid .opt { grid-template-rows: 46px auto auto; padding: 8px; }
  .buildgrid .mini { position: relative; border-radius: 4px; overflow: hidden; }
</style>

<div class="app">
  <div class="top"><div><h1>그렌바흐 변경성</h1><div class="date" id="date"></div></div><div class="speed" id="speed"></div></div>
  <div class="res" id="res"></div>
  <div class="crib" id="crib"></div>
  <div id="banner"></div>
  <div class="world" id="world"><div class="mount"></div><div class="mount b"></div><canvas class="snow" id="snow"></canvas></div>
  <div class="panel" id="panel"></div>
</div>
<div id="modal"></div>

<script src="data.js"></script>
<script>
(() => {
  const K = window.KEEP, R = K.rooms;
  const DAY_MS = 2600;
  const $ = id => document.getElementById(id);
  const world = $('world');
  const STAT = { str: '힘', dex: '손재주', heart: '마음' };
  const BODY = { str: '#B5652E', dex: '#B89A3E', heart: '#3F8A5E' };
  const clamp = (v, lo = 0, hi = 100) => Math.max(lo, Math.min(hi, v));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  let G, loop = null, raidLoop = null, acc = 0, last = 0, queue = [], showing = false;
  let geo = null; // 방 좌표
  const figs = new Map(); // folk id → {el, x, tx, wait}

  // ═════════ 상태 · 규칙 ═════════
  function newGame() {
    const rooms = {};
    K.layout.forEach((row, r) => row.forEach((t, c) => { rooms[`r${r}c${c}`] = t; }));
    G = {
      day: 0, res: { ...K.start }, rooms, folk: K.folk.map(f => ({ ...f, hp: 100, hurt: 0 })),
      julian: { health: 80, bond: 15 }, sus: 20, speed: 1, sel: null, raid: null, raidsWon: 0,
      ms: 0, absentUntil: -1, blizzardUntil: -1, log: [], over: null, refugeeIdx: 0, captiveIdx: 0,
    };
    figs.forEach(f => f.el.remove()); figs.clear();
    say('레오폴트 비젠이 성에 묵기 시작했다.');
    buildCastle();
    event({ img: 'media/ottilie.webp', eyebrow: '11월 1일', title: '3월 15일까지, 이 애를 지켜 내세요', text:
      '영지민을 손가락으로 끌어 방에 놓으면 그 방에서 일한다.\n\n· 요람실(아래 오른쪽)이 비면 율리안이 운다.\n· 응접실이 비면 레오폴트가 성을 엿보고, 의심이 쌓인다.\n· 북쪽에서 호르칸이 내려온다. 성문에서 못 막으면 방을 하나씩 뚫고 요람실까지 온다.\n· 빈 칸을 누르면 방을 짓는다.\n\n율리안을 빼앗기면 끝이다.',
      choices: [{ label: '성으로 들어간다' }] });
    start();
  }
  const slots = () => Object.keys(G.rooms);
  const at = slot => G.folk.filter(f => f.room === slot);
  const working = slot => at(slot).filter(f => !f.hurt);
  const typeOf = slot => G.rooms[slot];
  const slotOf = type => slots().find(s => G.rooms[s] === type);
  const popCap = () => K.popBase + slots().filter(s => G.rooms[s] === 'dorm').length * R.dorm.pop;
  const eleanor = () => G.folk.find(f => f.hero);
  const away = () => G.day < G.absentUntil;
  const dateOf = d => { for (const [m, n] of [['11월', 30], ['12월', 31], ['1월', 31], ['2월', 28], ['3월', 31]]) { if (d < n) return `${m} ${d + 1}일`; d -= n; } return '3월 이후'; };
  const say = t => { G.log.unshift(`${dateOf(G.day)} · ${t}`); G.log.length = Math.min(G.log.length, 20); };
  const sum = (arr, k) => arr.reduce((s, f) => s + f[k], 0);
  const best = f => ['str', 'dex', 'heart'].sort((a, b) => f[b] - f[a])[0];
  function rateOf(slot) { const t = R[typeOf(slot)]; return t && t.res ? sum(working(slot), t.stat) * t.rate : 0; }
  function daily() {
    const n = G.folk.length;
    const tot = r => slots().filter(s => R[typeOf(s)]?.res === r).reduce((a, s) => a + rateOf(s), 0);
    const care = working(slotOf('nursery')), parlor = working(slotOf('parlor'));
    return {
      food: tot('food') - 0.5 * n, wood: tot('wood') - (G.day < G.blizzardUntil ? 4 : 2), gold: tot('gold'),
      sus: 0.6 - sum(parlor, 'heart') * 0.08, bond: sum(care, 'heart') * 0.04 + (care.some(f => f.hero) ? 0.8 : 0), care,
    };
  }

  function start() {
    clearInterval(loop); last = performance.now(); acc = 0;
    loop = setInterval(() => {
      const now = performance.now(), dt = now - last; last = now;
      if (G.over || G.raid || showing || !G.speed) return;
      acc += dt * G.speed;
      while (acc >= DAY_MS && !G.over && !G.raid && !showing) { acc -= DAY_MS; dayTick(); }
    }, 100);
  }
  function dayTick() {
    const d = daily();
    G.day++;
    G.res.food = Math.max(0, G.res.food + d.food); G.res.wood = Math.max(0, G.res.wood + d.wood); G.res.gold += d.gold;
    for (const s of slots()) {
      const t = R[typeOf(s)];

    // 레오폴트: 응접실이 비면 안뜰을 엿보며 다닌다
    const leoIn = working(slotOf('parlor')).length > 0, ps = slotOf('parlor');
    const leo = ensureFig('__leo', { name: '레오폴트', room: leoIn ? ps : null }, 'leo'); alive.add('__leo');
    const la = areaOf({ room: leoIn ? ps : null });
    if (leo.room !== (leoIn ? ps : null)) { leo.room = leoIn ? ps : null; leo.x = la.x0 + 10; leo.tx = null; leo.el.querySelector('.eye')?.remove(); if (!leoIn) leo.el.insertAdjacentHTML('beforeend', '<span class="eye">엿보는 중</span>'); }
    if (leoIn) { leo.x = la.x1 - 6; leo.el.classList.remove('walk'); }
    else { if (leo.tx == null) leo.tx = la.x0 + Math.random() * (la.x1 - la.x0); const dx = leo.tx - leo.x, st = 0.025 * dt; if (Math.abs(dx) <= st) leo.tx = null; else leo.x += Math.sign(dx) * st; leo.el.classList.add('walk'); }
    leo.el.style.left = leo.x + 'px'; leo.el.style.top = (la.floor - 38) + 'px';
    // 호르칸
    for (let i = 0; i < 3; i++) {
      const id = '__raider' + i;
      if (G.raid) {
        const o = ensureFig(id, { name: i === 1 ? '호르칸' : '' }, 'raider'); alive.add(id);
        const r = geo.rooms[G.raid.path[G.raid.idx]];
        const tx = r.x + r.w - 18 - i * 16; o.x += (tx - o.x) * Math.min(1, dt / 160);
        o.el.style.left = o.x + 'px'; o.el.style.top = (r.y + r.h - 9 - 38) + 'px'; o.el.classList.add('work');
      }
    }
    for (const [id, o] of figs) if (!alive.has(id)) { o.el.remove(); figs.delete(id); }
  }

  // 끌어다 놓기 (+ 탭으로 고르기)
  function bindDrag(el, id) {
    let sx, sy, moved = false, pid = null;
    el.addEventListener('pointerdown', e => {
      e.stopPropagation(); pid = e.pointerId; el.setPointerCapture(pid); sx = e.clientX; sy = e.clientY; moved = false;
    });
    el.addEventListener('pointermove', e => {
      if (e.pointerId !== pid) return;
      if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) > 6) { moved = true; G.sel = id; figs.get(id).dragging = true; el.classList.add('drag'); syncRooms(); }
      if (moved) { const b = world.getBoundingClientRect(); el.style.left = (e.clientX - b.left) + 'px'; el.style.top = (e.clientY - b.top - 30) + 'px'; }
    });
    const up = e => {
      if (e.pointerId !== pid) return; pid = null;
      const o = figs.get(id); el.classList.remove('drag');
      if (!moved) { G.sel = G.sel === id ? null : id; renderPanel(); syncRooms(); return; }
      o.dragging = false;
      const b = world.getBoundingClientRect(), px = e.clientX - b.left, py = e.clientY - b.top;
      const slot = Object.entries(geo.rooms).find(([, r]) => px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h)?.[0];
      const y = geo.yard;
      if (slot) assign(id, slot); else if (px >= y.x && px <= y.x + y.w && py >= y.y - 20 && py <= y.y + y.h) { G.folk.find(f => f.id === id).room = null; G.sel = null; }
      else G.sel = null;
      renderPanel(); syncRooms();
    };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  }
  function assign(id, slot) {
    const f = G.folk.find(x => x.id === id), t = typeOf(slot);
    G.sel = null;
    if (!t || !R[t].cap) return note(t ? `${R[t].name}에는 일할 자리가 없다.` : '빈 칸이다. 먼저 방을 지어야 한다.');
    if (f.hurt) return note(`${f.name}은(는) 아직 다쳐 있다.`);
    if (f.room !== slot && at(slot).length >= R[t].cap) return note(`${R[t].name}은(는) 자리가 없다.`);
    f.room = slot;
    const fit = R[t].stat ? f[R[t].stat] : 0;
    note(`${f.name} → ${R[t].name}${R[t].stat ? ` (${STAT[R[t].stat]} ${Math.round(fit)})` : ''}`);
  }
  let noteMsg = '', noteT = 0;
  function note(t) { noteMsg = t; noteT = performance.now(); renderPanel(); }
  function tapSlot(slot) {
    if (G.sel) { assign(G.sel, slot); renderPanel(); syncRooms(); return; }
    if (!typeOf(slot)) return buildSheet(slot);
    const t = R[typeOf(slot)]; note(`${t.name} — ${t.desc}`);
  }
  function buildSheet(slot) {
    const opts = Object.entries(R).filter(([, r]) => !r.fixed);
    event({ eyebrow: '빈 칸', title: '무엇을 지을까', text: `금화 ${Math.floor(G.res.gold)}닢`, grid: true, choices: [
      ...opts.map(([k, r]) => ({ mini: `<div class="mini r-${k}">${DECOR[k] || ''}<div class="floor" style="position:absolute;left:0;right:0;bottom:0;height:6px;background:#5A4A3A"></div></div>`, label: `${r.name} · 금화 ${r.cost}`, sub: r.desc, disabled: () => G.res.gold < r.cost,
        fn: () => { G.res.gold -= r.cost; G.rooms[slot] = k; say(`${r.name}을(를) 지었다.`); buildCastle(); } })),
      { label: '그만둔다' },
    ] });
  }

  // ═════════ HUD ═════════
  const ICON = {
    food: '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="14" rx="9" ry="6" fill="#C98B4E"/><ellipse cx="12" cy="12" rx="7" ry="4" fill="#E2B074"/></svg>',
    wood: '<svg viewBox="0 0 24 24"><rect x="3" y="12" width="18" height="6" rx="3" fill="#8A6640"/><rect x="5" y="6" width="14" height="6" rx="3" fill="#A57D4F"/><circle cx="19" cy="15" r="2.4" fill="#D9B98A"/></svg>',
    gold: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#DDB95E"/><circle cx="12" cy="12" r="5" fill="none" stroke="#A9852F" stroke-width="1.6"/></svg>',
    folk: '<svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4" fill="#EBC9A8"/><rect x="6" y="12" width="12" height="9" rx="4" fill="#5A7FA8"/></svg>',
  };
  const fmt = v => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1);
  function renderHud() {
    if (!G) return;
    const d = daily(), j = G.julian, nextRaid = K.raids.find(r => r.day > G.day);
    $('date').textContent = `${dateOf(G.day)} · 인구 대장까지 ${Math.max(0, K.totalDays - G.day)}일`;
    $('speed').innerHTML = [[0, '❚❚'], [1, '1×'], [2, '2×'], [4, '4×']].map(([v, l]) => `<button data-sp="${v}" class="${G.speed === v ? 'on' : ''}" aria-label="속도 ${l}">${l}</button>`).join('');
    $('speed').querySelectorAll('button').forEach(b => b.onclick = () => { G.speed = +b.dataset.sp; renderHud(); });
    $('res').innerHTML = `<div class="pill">${ICON.food}<b>${Math.floor(G.res.food)}</b><span class="${d.food >= 0 ? 'up' : 'dn'}">식량 ${fmt(d.food)}</span></div>
      <div class="pill">${ICON.wood}<b>${Math.floor(G.res.wood)}</b><span class="${d.wood >= 0 ? 'up' : 'dn'}">장작 ${fmt(d.wood)}</span></div>
      <div class="pill">${ICON.gold}<b>${Math.floor(G.res.gold)}</b><span>금화 ${fmt(d.gold)}</span></div>
      <div class="pill">${ICON.folk}<b>${G.folk.length}/${popCap()}</b><span>습격 ${G.raidsWon}승</span></div>`;
    $('crib').innerHTML = `<img src="media/julian.webp" alt="율리안">
      <div class="meter m-health ${j.health < 30 ? 'warn' : ''}">율리안 건강 ${Math.round(j.health)}<div class="t"><i style="width:${j.health}%"></i></div></div>
      <div class="meter m-bond">애착 ${Math.round(j.bond)}<div class="t"><i style="width:${j.bond}%"></i></div></div>
      <div class="meter m-sus ${G.sus > 70 ? 'warn' : ''}">의심 ${Math.round(G.sus)}<div class="t"><i style="width:${G.sus}%"></i></div></div>`;
    $('banner').innerHTML = G.raid ? `<div class="banner">${esc(G.raid.name)} 습격 중! 힘센 영지민을 빨간 방으로 끌어다 막아라. 요람실이 마지막 방이다.</div>`
      : nextRaid && nextRaid.day - G.day <= 3 ? `<div class="banner">경보: ${esc(nextRaid.name)} ${nextRaid.day - G.day}일 뒤. 성문(왼쪽 위)에 힘센 영지민을.</div>`
      : G.day < G.blizzardUntil ? `<div class="banner cold">눈보라 — 장작 소모 두 배 (${G.blizzardUntil - G.day}일)</div>`
      : away() ? `<div class="banner cold">엘레노어는 수도에 있다 (${G.absentUntil - G.day}일 뒤 귀환)</div>` : '';
    renderPanel(); syncRooms();
    world.querySelectorAll('.prog i').forEach(i => { i.style.width = (acc / DAY_MS * 100) + '%'; });
  }
  function renderPanel() {
    const selF = G.sel && G.folk.find(x => x.id === G.sel);
    const fresh = performance.now() - noteT < 3500 ? noteMsg : '';
    $('panel').innerHTML = selF
      ? `<div class="who"><b>${esc(selF.name)} <span style="font-weight:400;color:var(--muted);font-size:12px">${esc(selF.role)}</span></b><button class="btn" id="toYard">안뜰로</button></div>
         <div class="stats3"><span>힘 <b>${selF.str.toFixed(1)}</b></span><span>손재주 <b>${selF.dex}</b></span><span>마음 <b>${selF.heart}</b></span><span>체력 <b>${Math.round(selF.hp)}</b></span></div>
         <p class="hint">${selF.hurt ? `부상 — ${selF.hurt}일 뒤 회복` : '빛나는 방을 누르면 그 방에서 일한다. 끌어다 놓아도 된다.'}</p>`
      : `<p class="hint">${fresh ? esc(fresh) : '영지민을 끌어다 방에 놓는다. 몸 색 = 잘하는 일 — <span style="color:#E0913E">주황 힘</span> · <span style="color:#DDB95E">노랑 손재주</span> · <span style="color:#63B585">초록 마음</span>'}</p>`;
    $('panel').insertAdjacentHTML('beforeend', `<div class="log">${G.log.slice(0, 3).map(l => `<div>${esc(l)}</div>`).join('')}</div>`);
    $('toYard')?.addEventListener('click', () => { selF.room = null; G.sel = null; renderPanel(); syncRooms(); });
  }

  // 눈
  const snow = $('snow'), sctx = snow.getContext('2d'); let flakes = [];
  function sizeSnow() { const dpr = devicePixelRatio || 1; snow.width = world.clientWidth * dpr; snow.height = (geo?.H || 600) * dpr; sctx.setTransform(dpr, 0, 0, dpr, 0, 0); flakes = Array.from({ length: 70 }, () => ({ x: Math.random() * world.clientWidth, y: Math.random() * 160, s: 0.6 + Math.random() * 1.6, v: 0.01 + Math.random() * 0.03 })); }
  function drawSnow(dt) {
    const heavy = G && G.day < G.blizzardUntil;
    sctx.clearRect(0, 0, snow.width, snow.height); sctx.fillStyle = 'rgba(255,255,255,.8)';
    for (const f of flakes) { f.y += f.v * dt * (heavy ? 3 : 1); f.x += (heavy ? 0.06 : 0.01) * dt; if (f.y > 156) { f.y = -4; f.x = Math.random() * world.clientWidth; } if (f.x > world.clientWidth) f.x = 0; sctx.beginPath(); sctx.arc(f.x, f.y, f.s, 0, 7); sctx.fill(); }
  }

  let lastF = performance.now();
  function frame(now) {
    const dt = Math.min(60, now - lastF); lastF = now;
    animate(dt); drawSnow(dt);
    if (G && !G.raid && !showing && G.speed) world.querySelectorAll('.prog i').forEach(i => { i.style.width = Math.min(100, (acc / DAY_MS * 100)) + '%'; });
    requestAnimationFrame(frame);
  }
  addEventListener('resize', () => { if (G) buildCastle(); });
  newGame(); renderHud(); requestAnimationFrame(frame);
})();
</script>
